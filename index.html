<body>
<style>
/* Layout: loud color-blocked bands (violet hero → lime ticker → black stats → color case cards → grid-paper about → contact), stickers + 4-point sparkles as the only ornament. Single committed look (no dark/light switch). */
:root{
  --violet:#5b4cf8; --lime:#c6ff3d; --pink:#ff85f5; --black:#1b1b1f; --paper:#f4f1e9; --white:#ffffff;
  --ink:#1b1b1f; --line:rgba(27,27,31,.14);
  --cond:"Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --fun:"Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --wrap:1200px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--black); color:var(--ink); font:17px/1.6 var(--body); margin:0; overflow-x:hidden}
a{color:inherit}
img{max-width:100%; display:block}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--lime); outline-offset:3px; border-radius:6px}
.cond{font-family:var(--cond); font-weight:400; text-transform:uppercase; letter-spacing:-.005em; line-height:.9}
.mono{font:500 12px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase}
mark{background:var(--pink); color:var(--black); padding:0 .18em; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
mark.lime{background:var(--lime)}

/* header */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--black)}
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--black); color:var(--white)}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px}
.logo{font:400 26px/1 var(--fun); text-decoration:none; color:var(--white); display:flex; align-items:center; gap:4px}
.logo svg{width:22px; height:22px; fill:var(--lime); transform:translateY(-6px)}
nav.links{display:flex; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font:700 14px/1 var(--body); text-decoration:none; border:2px solid currentColor; background:transparent; color:inherit; cursor:pointer; white-space:nowrap; transition:transform .15s ease}
.pill:hover{transform:translateY(-2px) rotate(-1deg)}
.pill.violet{background:var(--violet); border-color:var(--violet); color:var(--white)}
.pill.lime{background:var(--lime); border-color:var(--lime); color:var(--black)}
.pill.black{background:var(--black); border-color:var(--black); color:var(--white)}
.pill.big{padding:15px 24px; font-size:16px}
@media (max-width:640px){ nav.links .hide-sm{display:none} }

/* sparkle + sticker */
.spark{display:inline-block; width:1em; height:1em; vertical-align:-.1em}
.spark path{fill:currentColor}
.sticker{position:absolute; width:150px; height:150px; border-radius:50%; display:grid; place-items:center; z-index:2}
.sticker svg.ring{position:absolute; inset:0; width:100%; height:100%; animation:spin 18s linear infinite}
.sticker text{font:700 11.5px var(--mono); letter-spacing:.14em; text-transform:uppercase}
.sticker .core{font:400 22px/1 var(--fun); text-align:center; transform:rotate(-8deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* hero */
.hero{background:var(--violet); color:var(--white); position:relative; overflow:hidden}
.hero .wrap{position:relative; padding-block:56px 64px}
.hero-grid{display:block}
.title-row{display:flex; align-items:center; gap:clamp(28px,4vw,56px); flex-wrap:wrap}
.hero .hi{position:relative; z-index:1; min-width:0}
/* doodles en las esquinas */
.dd{position:absolute; pointer-events:none; z-index:0}
.d-tl{top:18px; left:-26px; width:150px; color:var(--paper); transform:rotate(-12deg)}
.d-tr{top:-34px; right:6%; width:120px; color:var(--lime); transform:rotate(14deg)}
.d-bl{bottom:-30px; left:3%; width:140px; color:var(--pink); transform:rotate(8deg)}
.d-br{bottom:-40px; right:-30px; width:170px; color:var(--paper)}
.d-bm{bottom:22px; left:46%; width:110px; color:var(--lime); transform:rotate(-6deg)}
@media (max-width:860px){ .d-tl{width:100px; left:-30px} .d-tr{width:80px} .d-bm{display:none} .d-bl{width:96px} .d-br{width:120px} }
/* foto */
.photo{position:relative; z-index:1; width:clamp(150px, 19vw, 270px); flex:none}
.photo img{width:100%; height:auto; aspect-ratio:1/1; object-fit:cover; border-radius:24px; border:4px solid var(--black); box-shadow:10px 10px 0 var(--lime); transform:rotate(3deg)}
.hero .kicker{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.hero h1{font-size:clamp(76px, 15.5vw, 210px); position:relative}
.hero h1 .row2{display:block; color:var(--lime)}
.hero .sub{font:600 clamp(19px,2.4vw,28px)/1.35 var(--body); max-width:30ch; margin-top:28px}
.hero .ctas{display:flex; gap:12px; flex-wrap:wrap; margin-top:30px}
.hero .sticker{width:112px; height:112px; right:-52px; bottom:-36px; background:var(--pink); color:var(--black)}
.hero .sticker .core{font-size:16px} .hero .sticker text{font-size:9.5px}
.hero .s2{position:absolute; left:-20px; top:-20px; width:46px; height:46px; color:var(--lime); z-index:2}
.hero h1{font-size:clamp(76px, 11.5vw, 172px)}
@media (max-width:640px){ .photo{width:150px} .hero .sticker{width:92px; height:92px; right:-40px; bottom:-26px} .hero .sticker .core{font-size:13px} .hero .sticker text{font-size:8px} }

/* ticker */
.ticker{background:var(--lime); color:var(--black); overflow:hidden; border-block:2px solid var(--black)}
.ticker .track{display:flex; width:max-content; gap:28px; padding-block:12px; animation:slide 30s linear infinite; font:400 22px/1 var(--cond); text-transform:uppercase; letter-spacing:.02em}
.ticker span{display:inline-flex; align-items:center; gap:28px; white-space:nowrap}
.ticker .spark{width:18px; height:18px; color:var(--violet)}
@keyframes slide{to{transform:translateX(-50%)}}

/* stats */
.stats{background:var(--black); color:var(--white)}
.stats .wrap{padding-block:64px}
.stat-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:28px}
@media (max-width:860px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{border-radius:22px; padding:22px; display:flex; flex-direction:column; justify-content:space-between; gap:28px; min-height:190px; color:var(--black)}
.stat b{font:400 clamp(44px,5.4vw,72px)/.9 var(--cond); font-variant-numeric:tabular-nums}
.stat span{font-weight:600; font-size:15px; line-height:1.35}
.c-pink{background:var(--pink)} .c-lime{background:var(--lime)} .c-violet{background:var(--violet); color:var(--white)} .c-paper{background:var(--paper)}
.sec-title{display:flex; justify-content:space-between; align-items:end; gap:18px; flex-wrap:wrap}
.sec-title h2{font-size:clamp(56px,9vw,120px)}
.sec-title p{max-width:34ch; font-weight:500}

/* cases */
.cases{background:var(--black); color:var(--white)}
.cases .wrap{padding-block:24px 80px}
.case-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:28px}
@media (max-width:760px){ .case-grid{grid-template-columns:1fr} }
.ccard{border-radius:26px; padding:22px; display:flex; flex-direction:column; gap:18px; text-decoration:none; color:var(--black); position:relative; transition:transform .2s ease}
.ccard.c-violet{color:var(--white)}
.ccard:hover{transform:translateY(-4px) rotate(-.4deg)}
.ccard .top{display:flex; justify-content:space-between; gap:10px; align-items:start}
.ccard h3{font-size:clamp(34px,3.8vw,48px)}
.badge{font:700 12px/1 var(--body); padding:7px 11px; border-radius:999px; background:var(--black); color:var(--white); white-space:nowrap}
.ccard .shot{aspect-ratio:16/10; border-radius:16px}
.ccard .bottom{display:flex; justify-content:space-between; align-items:end; gap:16px}
.ccard .bottom p{font-weight:600; max-width:36ch; line-height:1.4}
.arrow{width:44px; height:44px; flex:none; border:2px solid currentColor; border-radius:50%; display:grid; place-items:center; font-size:20px; transition:transform .2s ease}
.ccard:hover .arrow{transform:rotate(45deg)}

/* image slots */
.shot{position:relative; overflow:hidden; background:rgba(27,27,31,.08); max-width:100%; border-radius:16px}
.c-violet .shot{background:rgba(255,255,255,.12)}
.shot img{width:100%; height:100%; object-fit:cover}
.shot.free{aspect-ratio:auto}
.shot.free img{height:auto; object-fit:contain}
.shot .ph{position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:6px; padding:16px; border:2px dashed currentColor; border-radius:16px; opacity:.85}
.shot.free .ph{position:relative; min-height:240px}
.ph b{font:700 15px/1.3 var(--body)}
.ph code{font:500 12px/1.4 var(--mono); word-break:break-all}
.ph small{font:12px/1.3 var(--mono); opacity:.7}
figure{margin:0; display:flex; flex-direction:column; gap:10px}
figcaption{font-size:14px; opacity:.7}

/* about */
.about{background:var(--paper); background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:36px 36px; color:var(--black); border-radius:36px 36px 0 0}
.about .wrap{padding-block:80px}
.about-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:40px; margin-top:32px; align-items:start}
@media (max-width:860px){ .about-grid{grid-template-columns:1fr} }
.about .text{display:flex; flex-direction:column; gap:16px; font-size:19px; max-width:58ch; font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.chip{font:700 13px/1 var(--body); padding:9px 13px; border-radius:999px; border:2px solid var(--black); background:var(--white)}
.chip:nth-child(3n+1){background:var(--lime)} .chip:nth-child(3n+2){background:var(--pink)}
.tl{background:var(--black); color:var(--white); border-radius:26px; padding:10px 22px; list-style:none; margin:0}
.tl li{display:grid; grid-template-columns:96px 1fr; gap:14px; padding-block:16px; border-bottom:1px solid rgba(255,255,255,.14)}
.tl li:last-child{border-bottom:0}
.tl .when{font:500 12px/1.7 var(--mono); color:var(--lime)}
.tl b{display:block; font-weight:700}
.tl span{opacity:.7; font-size:15px}

/* contact */
.contact{background:var(--paper); color:var(--black)}
.contact .wrap{padding-block:24px 96px; text-align:center; position:relative}
.contact h2{font-size:clamp(72px,14vw,180px); position:relative; display:inline-block}
.contact h2 .spark{position:absolute; top:-8%; left:-10%; width:.42em; height:.42em; color:var(--violet)}
.contact .sticker{position:absolute; right:-6%; bottom:-10%; background:var(--lime); width:120px; height:120px; color:var(--black)}
.contact .sticker .core{font-size:18px}
.contact .lead{font-weight:600; font-size:20px; margin:28px auto 0; max-width:40ch}
.contact-list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:36px auto 0; max-width:860px; text-align:left}
@media (max-width:760px){ .contact-list{grid-template-columns:1fr} .contact .sticker{display:none} }
.ci{background:var(--white); border:2px solid var(--black); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; min-width:0}
.ci dd{margin:0; font-weight:700; user-select:all; overflow-wrap:anywhere}
.ci .pill{align-self:start}
footer{background:var(--black); color:var(--white)}
footer .wrap{padding-block:26px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; opacity:.85}

/* case page */
.chero{background:var(--violet); color:var(--white); position:relative; overflow:hidden}
.chero .wrap{padding-block:40px 56px; position:relative}
.back{display:inline-flex; margin-bottom:28px}
.chero h1{font-size:clamp(56px,10vw,132px)}
.chero .lead{font:600 clamp(19px,2.3vw,26px)/1.35 var(--body); max-width:34ch; margin-top:22px}
.chero-grid{display:grid; grid-template-columns:1.5fr .9fr; gap:36px; align-items:end}
@media (max-width:860px){ .chero-grid{grid-template-columns:1fr} }
.ticket{background:var(--lime); color:var(--black); border-radius:20px; padding:20px 22px; position:relative; transform:rotate(1.2deg); font-size:15px}
.ticket .th{display:flex; justify-content:space-between; padding-bottom:10px; border-bottom:2px dashed rgba(27,27,31,.35); margin-bottom:4px}
.ticket .row{display:flex; justify-content:space-between; gap:14px; padding-block:9px; border-bottom:1px dashed rgba(27,27,31,.25)}
.ticket .row:last-child{border-bottom:0}
.ticket .row span:first-child{font:500 12px/1.9 var(--mono); text-transform:uppercase; letter-spacing:.05em}
.ticket .row span:last-child{font-weight:700; text-align:right}
.cbody{background:var(--paper); color:var(--black)}
.cover-wrap{padding-block:40px 8px}
.chapters{display:grid; gap:64px; padding-block:48px 72px}
.chapter{display:grid; grid-template-columns:240px minmax(0,1fr); gap:32px}
@media (max-width:860px){ .chapter{grid-template-columns:1fr; gap:14px} }
.chapter > h2{font-size:clamp(40px,4.4vw,56px); position:sticky; top:84px; align-self:start}
@media (max-width:860px){ .chapter > h2{position:static} }
.content{display:flex; flex-direction:column; gap:18px; min-width:0}
.content p,.content ul,.content ol{max-width:64ch}
.content h3{font:800 22px/1.25 var(--body); margin-top:10px}
.content ul,.content ol{margin:0; padding-left:22px; display:grid; gap:10px}
.content li::marker{color:var(--violet); font-weight:800}
.pair{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
@media (max-width:640px){ .pair,.trio{grid-template-columns:1fr} }
.finding{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; padding:18px 20px; background:var(--white); border:2px solid var(--black); border-radius:20px; max-width:72ch}
.finding .k{font:700 12px/1 var(--body); padding:7px 10px; border-radius:999px; align-self:start; text-align:center}
.finding .k.v{background:var(--pink)} .finding .k.d{background:var(--lime)}
.impact{background:var(--black); color:var(--white); border-radius:28px; padding:34px; display:grid; gap:14px; position:relative; overflow:hidden}
.impact .big{font-size:clamp(46px,6.6vw,86px); color:var(--lime)}
.impact p{max-width:58ch; opacity:.85}
.impact .spark{position:absolute; right:22px; top:22px; width:54px; height:54px; color:var(--pink)}
.next{background:var(--black); color:var(--white)}
.next .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:36px}
.next a{text-decoration:none}
.next small{display:block; margin-bottom:8px; opacity:.7}
.next b{font-size:clamp(28px,4vw,44px)}

/* ====== v3: layout dividido, slider, transiciones ====== */
:root{--ease:cubic-bezier(.22,1,.36,1)}
section{position:relative}
.stats .wrap,.cases .wrap,.about .wrap,.contact .wrap,.hero .ctas{position:relative; z-index:1}
.stats,.cases,.about,.contact{overflow:hidden}

/* encabezado y casos: texto + imagen a la misma altura, mínimo 24px entre ambos */
.split{display:flex; align-items:flex-start; gap:clamp(24px,4vw,64px)}
.split-text{position:relative; z-index:1; flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:22px}
.split-text h1{margin:0}
.split-text .sub{margin:0}
.split-media{flex:none; position:relative; z-index:1}
.hero .split-media.photo{width:auto}
.hero .photo img{width:100%; height:100%; aspect-ratio:auto; object-fit:cover}
.hero .kicker{margin:0}
.hero .ctas{margin-top:34px}
.cover-media{width:min(44%, 560px)}
.cover-media .shot{height:100%; aspect-ratio:auto; border:4px solid var(--black); border-radius:24px; box-shadow:10px 10px 0 var(--lime); transform:rotate(1.5deg); background:var(--paper)}
.chero .split-text .sub{font:600 clamp(19px,2.2vw,25px)/1.35 var(--body); max-width:34ch}
.chero h1{font-size:clamp(52px,7.4vw,112px)}
@media (max-width:760px){
  .split{flex-direction:column; align-items:stretch}
  .hero .split-media.photo{width:min(100%, 340px); align-self:flex-start; margin-right:40px}
  .hero .photo img{aspect-ratio:1/1; height:auto}
  .cover-media{width:100%}
  .cover-media .shot{height:auto; aspect-ratio:16/10}
}

/* títulos de sección: título arriba, descripción abajo */
.sec-title{flex-direction:column; align-items:flex-start; gap:16px}
.sec-title p{max-width:52ch; font-size:19px}
.stats .sec-title, .cases .sec-title{color:var(--white)}

/* resultados */
.stat{position:relative; overflow:hidden; transition:transform .45s var(--ease), box-shadow .45s var(--ease); cursor:default}
.stat:hover{transform:scale(1.06) rotate(-1deg); box-shadow:0 24px 50px -20px rgba(0,0,0,.6); z-index:2}
.stat b{line-height:.92}
.stat-dd{position:absolute; right:14px; top:14px; width:54px; height:54px; opacity:.9; transition:transform .6s var(--ease)}
.c-lime .stat-dd{color:var(--violet)} .c-pink .stat-dd{color:var(--violet)} .c-violet .stat-dd{color:var(--lime)} .c-paper .stat-dd{color:var(--pink)}
.stat:hover .stat-dd{transform:rotate(90deg) scale(1.15)}
.dots{display:none; justify-content:center; gap:8px; margin-top:18px}
.dots i{width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.3); transition:width .3s var(--ease), background .3s}
.dots i.on{width:26px; background:var(--lime)}
.d-stats1{width:120px; right:-28px; top:40px; color:var(--pink)}
.d-stats2{width:150px; left:-20px; bottom:20px; color:var(--violet)}
@media (max-width:860px){
  .stat-grid{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:14px; padding:8px 4px 14px; margin-inline:-4px; scrollbar-width:none}
  .stat-grid::-webkit-scrollbar{display:none}
  .stat{flex:0 0 84%; scroll-snap-align:center; min-height:220px}
  .stat:hover{transform:none}
  .dots{display:flex}
}

/* casos */
.ccard .shot img{transition:transform .7s var(--ease)}
.ccard:hover .shot img{transform:scale(1.04)}
.ccard{transition:transform .45s var(--ease), box-shadow .45s var(--ease)}
.ccard:hover{box-shadow:0 26px 60px -24px rgba(0,0,0,.7)}
.shot.loaded img{animation:imgIn .7s var(--ease) both}
@keyframes imgIn{from{opacity:0; transform:scale(1.03)}to{opacity:1; transform:none}}

/* sobre mí */
.d-about1{width:110px; right:4%; top:40px; color:var(--violet)}
.d-about2{width:130px; left:-20px; bottom:60px; color:var(--pink)}
.chip{transition:transform .3s var(--ease)}
.chip:hover{transform:translateY(-3px) rotate(-3deg)}
.tl li{transition:transform .35s var(--ease); position:relative}
.tl li::before{content:""; position:absolute; left:-22px; top:16px; bottom:16px; width:4px; border-radius:4px; background:var(--lime); transform:scaleY(0); transition:transform .35s var(--ease)}
.tl li:hover{transform:translateX(8px)}
.tl li:hover::before{transform:scaleY(1)}

/* contacto */
.ci dd a{text-decoration:underline; text-decoration-color:var(--violet); text-underline-offset:3px}
.ci{transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
.ci:hover{transform:translateY(-4px); box-shadow:6px 6px 0 var(--black)}

/* ficha del caso, ahora horizontal */
.cbody .ticket{transform:rotate(-.6deg); margin-top:36px}
.trow{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:4px 22px}
.trow .cell{display:flex; flex-direction:column; gap:4px; padding-block:10px; border-bottom:1px dashed rgba(27,27,31,.25)}

  summary:[["El problema","Reportes por correo que no llegaban, pagos que solo una persona podía confirmar y un equipo comercial y técnico dedicado a soporte. Los comercios querían cancelar."],["Qué hice","Diseñé el portal desde cero y, en dupla con UX research, validé cada funcionalidad con comercios en 7 estudios entre 2024 y 2026."],["Resultado","De 25 empresas piloto a más de 2.000 comercios que se autogestionan, y 40 horas semanales de desarrolladores senior de vuelta al roadmap."]],

      {ul:["<b>Reportes:</b> se enviaban por correo y muchos no llegaban porque caímos en listas negras. Sin reportes, los comercios no podían cerrar caja y querían cancelar el servicio.","<b>Transacciones:</b> la confirmación de pago le llegaba a una sola persona de la empresa. El cajero no podía verificarla, desconfiaba de comprobantes falsos y terminaba llamando a servicio al cliente.","<b>Integraciones:</b> cada comercio que se conectaba por API necesitaba acompañamiento de desarrolladores senior, el asesor comercial y el arquitecto de merchants."]}]},

      {p:"Lideré el diseño de punta a punta, de discovery a QA visual. Venía de trabajar en el mantenimiento del back office interno de Deuna, así que conocía bien cómo se afiliaban y gestionaban los comercios. Definí la arquitectura de información, diseñé y prototipé cada flujo, e hice la investigación en dupla con UX research: con Elizabeth Mendoza en el benchmark y los tests de reportes y transacciones del MVP, y con Diana Rivadeneira desde roles y permisos en adelante. Planeamos cada estudio, moderamos las sesiones, sintetizamos los hallazgos y aplicamos las mejoras al diseño."}]},

      {p:"Salimos con un piloto de 25 empresas, el número que definió el equipo de seguridad para el MVP, y medimos satisfacción, recomendación y facilidad de uso con una encuesta a las empresas participantes. Funcionó tan bien que hubo que masificarlo."}]},
    {h:"2. Perfil desarrollador y sandbox", blocks:[
      {p:"Los desarrolladores de los comercios ahora tienen documentación, credenciales, configuración de webhooks y un sandbox para probar su integración por su cuenta. Lo priorizamos para liberar a la célula: las 40 horas semanales que 3 desarrolladores senior dedicaban a soporte volvieron al roadmap."},
      {p:"El sandbox tiene dos pasos: configurar el webhook con sus credenciales y simular un cobro de prueba con un QR, CUP o deeplink para ver la respuesta (aprobado, rechazado o pendiente) y el comprobante, sin tocar dinero real."},
      {video:{src:"deuna/sandbox-video",label:"Recorrido: documentación, centro de pruebas, webhook y cobro simulado"}},
      {fig:img("deuna/sandbox2","Centro de pruebas: configurar webhook y simular un cobro","1600×1000",{free:true})}]},
    {h:"3. Roles y permisos", blocks:[
      {p:"En los primeros tests apareció una señal: 4 de 10 comercios querían que sus vendedores vieran reportes, pero solo de su sucursal. Con el portal en uso, el acceso recaía en una sola persona por empresa. Diseñé un modelo de roles según la estructura del comercio (grupo, empresa, sucursal y caja) y lo probamos con 8 administradores."},
      {stats:[["8/8","estuvieron de acuerdo con los tres roles propuestos"],["8/8","invitaron a un colaborador con éxito"],["25%","completó la edición de permisos: la tarea más difícil"]]},
      {finding:["Solo 2 de 8 lograron quitar un permiso. Confundían la lista de colaboradores con la de roles y no entendían que debían crear un rol personalizado.","Simplificamos la edición de permisos y separamos con claridad colaboradores de roles."]},
      {finding:["7 de 8 cambiaron un rol sin problema, pero 6 no entendieron qué permisos ganaba la persona.","Agregamos un resumen de los nuevos permisos antes de confirmar el cambio."]},
      {finding:["5 de 6 empresas usan correo institucional para administradores, pero los cajeros rotan mucho.","Habilitamos un método de acceso alternativo para cajeros."]},
      {ul:["<b>Administrador de grupo:</b> ve y gestiona todas las empresas del grupo.","<b>Administrador de empresa:</b> gestiona su empresa, sus sucursales y quién ve qué.","<b>Consulta:</b> permisos variables que define el administrador.","<b>Desarrollador:</b> solo las funciones de integración."]},
      {h3:"Cómo se invita a un colaborador"},
      {p:"Desde el estado vacío, el administrador invita con correo y nombre, elige el rol, define qué sucursales verá y revisa los permisos que trae ese rol antes de enviar. Los permisos son fijos por rol para evitar el error que vimos en el test: nadie tiene que armar un rol personalizado."},
      {video:{src:"deuna/roles-video",label:"Recorrido: invitar a un colaborador"}},
      {fig:img("deuna/roles2","Invitar colaborador: estado vacío, formulario e invitación enviada","1600×1000",{free:true})},
      {p:"Hoy estamos iterando el primer alcance: gestión de colaboradores con estados que explican su causa, auditoría de cambios y protección para no dejar a una empresa sin administrador."}]},
    {h:"Lo que vino después", blocks:[
      {p:"Con la base funcionando, seguimos con el mismo método de investigar, probar e iterar en dos frentes:"},
      {ul:["<b>Grupos empresariales:</b> los holdings entraban empresa por empresa y consolidaban en Excel. Exploramos tres flujos en media fidelidad y llegamos a un dashboard consolidado para el administrador del grupo.","<b>Reportes consolidados:</b> solo había reportes diarios. Diseñé un asistente de cuatro pasos para crear reportes de cualquier rango, con generación en segundo plano y probado con tres tareas antes del lanzamiento."]},
      {pair:[img("deuna/grupos-hifi","Dashboard del grupo en alta fidelidad","1600×1000",{free:true}),img("deuna/reportes2","Los cuatro pasos para crear un reporte personalizado","1600×1000",{free:true})]}]},
    {h:"Qué aprendí", blocks:[
      {learn:"En B2B, el lenguaje interno es el enemigo. “Pagos”, “reportes” o “rol personalizado” tenían sentido para nosotros y confundían al comercio. Probar cada funcionalidad nos ahorró capacitar a 2.000 comercios después."}]},
  ],
  impact:{big:"25 → +2.000 comercios", p:"Comercios que confirman pagos, descargan reportes, gestionan sus equipos e integran la API sin llamar a soporte. El equipo técnico recuperó las 40 horas semanales que dedicaba a soporte de integraciones."}
},
{
  id:"cup", noSlots:true, title:"Código Único de Pago",
  card:"Pagar en caja sin QR: 6 dígitos, aceptado en +45.000 puntos de venta",
  lead:"Pagar en caja sin QR: un código de 6 dígitos que el cajero dicta y el cliente ingresa en la app Deuna o en la banca móvil de Banco Pichincha.",
  tags:["App","Pagos","Research"], year:"2024", status:"En producción",
  meta:[["Rol","Product Designer"],["Research","Dupla con Elizabeth Mendoza"],["Plataforma","App Deuna y Banca Móvil Pichincha"],["Validación","2 tests moderados · 16 personas"],["Estado","En producción"]],
  summary:[["El problema","Los QRs falsos hicieron que muchos comercios dejaran de mostrar el QR de Deuna, y los grandes comercios no tenían una pantalla en caja para mostrarlo."],["Qué hice","Benchmark, priorización, storyboard, flujo de punta a punta con sus estados de error y dos tests moderados en agencias bancarias, en la app Deuna y en la banca móvil."],["Resultado","En producción para todos los usuarios, aceptado en más de 45.000 puntos de venta y disponible desde la banca móvil de Banco Pichincha."]],
  cover:img("cup/cover","Código Único de Pago: elegir la opción, ingresar los 6 dígitos y recibir el comprobante"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"En Ecuador empezaron a circular QRs falsos. Muchos comercios dejaron de exhibir el QR de Deuna por miedo al fraude, y los grandes comercios, con varias cajas, tampoco tenían una pantalla donde mostrarlo. Son el mismo problema: si no hay QR a la vista, el cliente no paga con Deuna."},
      {p:"El objetivo de negocio era subir los usuarios activos y el MDR con un método de pago para grandes comercios sin interfaz para QR, disponible en Deuna, en la banca móvil y en cooperativas."}]},
    {h:"Mi rol", blocks:[
      {p:"Lo trabajamos end-to-end con mi dupla de research, Elizabeth Mendoza: benchmark, priorización, storyboard, diseño, pruebas con usuarios e iteración. Yo diseñé el flujo completo, del punto de entrada a los estados de error y los prototipos de alta fidelidad, y co-facilité los tests."}]},
    {h:"Benchmark y priorización", blocks:[
      {p:"Revisamos cómo pagan las billeteras en Latinoamérica y Estados Unidos. Encontramos cuatro patrones y los comparamos con tres criterios: que escale, que funcione en varios dispositivos y que sea fácil para el usuario."},
      {fig:img("cup/benchmark","Benchmark: cuatro patrones de pago con billeteras","1600×1000",{free:true})},
      {p:"El código ganó: funciona sin tarjeta, no depende de un QR impreso y el mismo gesto sirve en caja, en una tienda online o desde otra app bancaria."}]},
    {h:"El momento de uso", blocks:[
      {p:"Antes de diseñar pantallas, dibujamos la escena: una caja con fila, un cajero que dicta el código en voz alta y un cliente que nunca había pagado así. Cada paso extra era un segundo más frente al cajero."},
      {fig:img("cup/storyboard","Storyboard: pagar en caja con el código","1600×1280",{free:true})}]},
    {h:"La solución", blocks:[
      {p:"El código vive dentro de “Pagar”, junto al QR de Deuna, con una etiqueta de “Nuevo”: no creamos un acceso aparte en el home. El usuario ingresa los 6 dígitos, revisa comercio y monto, paga y recibe el comprobante."},
      {video:{src:"cup/pago-video",label:"Recorrido: de Pagar al comprobante"}},
      {fig:img("cup/flujo","Flujo final en la app Deuna","1600×1000",{free:true})},
      {p:"Un pago en caja tampoco puede quedarse colgado. Diseñé salidas claras para código inválido, saldo insuficiente, límite transaccional y error del servicio, cada una con qué pasó y qué hacer, y siempre con la opción de pagar de otra forma."},
      {fig:img("cup/estados","Ingreso del código, error y confirmación","1600×1000",{free:true})}]},
    {h:"Test 1: app Deuna", blocks:[
      {p:"Test moderado en una agencia de Banco Pichincha con 6 personas y el prototipo en mano. Queríamos saber si entendían cómo funciona el código y dónde se trababan."},
      {stats:[["5/6","buscaron el código en “Pagar”"],["6","personas en el test"],["2","microinteracciones comparadas"],["0","observaciones en monto y confirmación"]]},
      {finding:["Confundían el código con una OTP o clave de verificación.","Cambiamos el texto a “Es un número que te entrega el negocio y cambia cada vez que pagues” y agrupamos los dígitos de dos en dos para que se lea como un código de pago."]},
      {finding:["No notaban diferencia entre las dos microinteracciones del campo.","Nos quedamos con la más simple: casillas que avanzan solas y validan al completar el sexto dígito."]},
      {finding:["Mostraban el comprobante al cajero para que le tomara foto, como en las tiendas pequeñas.","El comprobante destaca monto, comercio y número de transacción, y el comercio recibe la confirmación en caja."]},
      {finding:["Monto y confirmación no generaron ninguna observación.","No las tocamos. Saber qué no cambiar también es una decisión."]}]},
    {h:"Test 2: banca móvil", blocks:[
      {p:"El código también tenía que funcionar desde la banca móvil de Banco Pichincha. Hicimos un segundo test moderado con 10 personas para elegir el nombre y la posición del acceso a Deuna dentro de la app del banco, midiendo tiempo en tarea y tasa de éxito."},
      {finding:["Los 3 que pidieron ayuda y los 4 que no completaron la tarea no encontraron el acceso a Deuna en el Home. “Escanear o mostrar QR” no comunicaba que también existe el código.","Propusimos un nombre que abarque todas las formas de pago con Deuna y lo llevamos a los tabs superiores, la opción más rápida en tiempo en tarea."]},
      {fig:img("cup/hallazgos","Síntesis de los dos tests","1600×1000",{free:true})}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Un método de pago nuevo compite con la costumbre: los usuarios lo buscan donde ya pagan y lo leen con lo que ya conocen, como una OTP. Diseñar fue sobre todo quitar esas confusiones."}]},
  ],
  impact:{big:"+45.000 puntos de venta", p:"En producción para todos los usuarios de Deuna, aceptado en más de 45.000 puntos de venta tras la alianza con Datafast, y disponible también desde la banca móvil de Banco Pichincha."}
},

{
  id:"suscripciones", noSlots:true, title:"Suscripciones y débitos automáticos",
  card:"Débitos automáticos sin tarjeta, desde la billetera",
  lead:"Pagar suscripciones y pedidos con la billetera, sin tarjeta: una tokenización compleja convertida en “vincular cuenta”.",
  tags:["App","Pagos","Research"], year:"2026", status:"En desarrollo",
  meta:[["Rol","Senior Product Designer"],["Research","Desk research y benchmark propios"],["Plataforma","App Deuna + apps de comercios"],["Estado","En desarrollo"]],
  summary:[["El problema","Los comercios digitales internacionales que cobran vía dLocal solo aceptaban tarjeta, y Deuna no tiene tarjeta."],["Qué hice","Desk research y benchmark de pagos recurrentes en Latinoamérica, flujos entre apps, prototipos de prueba, estados de error y medición por paso."],["Resultado","Un método de pago recurrente sin tarjeta: el usuario vincula su cuenta una vez y paga sin salir de la app del comercio."]],
  cover:img("suscripciones/cover","Vinculación: elegir Deuna en el comercio, aceptar y volver"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Pedir comida, pagar una plataforma de streaming o una membresía: casi todo cobro recurrente en apps exige una tarjeta. Deuna no tiene tarjeta, y no queríamos inventar una."},
      {p:"La oportunidad vino de dLocal, el procesador que cobra en Latinoamérica para comercios digitales internacionales de delivery, movilidad, streaming y e-commerce. Para que esos comercios pudieran cobrar con Deuna, la billetera necesitaba la capacidad de un cobro automático."},
      {p:"La respuesta técnica fue tokenizar la cuenta del usuario: un token que se comporta como una tarjeta frente al comercio y que se le entrega solo cuando el usuario acepta la vinculación. La pregunta de diseño: ¿cómo le explicas eso a alguien que solo quiere pagar su pedido?"}]},
    {h:"Mi rol", blocks:[
      {p:"Lideré el diseño de punta a punta en la app de Deuna. Hice yo misma el desk research y el benchmark, diseñé los flujos de vinculación, pago y desvinculación con sus errores, armé los prototipos de prueba y la presentación para el banco, y definí qué medir en cada paso. Trabajé con arquitectura y desarrollo para entender qué permitía la tokenización y dónde estaban sus límites."}]},
    {h:"Investigación", blocks:[
      {p:"Los objetivos eran claros: subir el MDR con ingresos recurrentes, habilitar pagos recurrentes desde la cuenta Deuna y construir algo que sirviera para muchos comercios, no una solución a la medida de uno."},
      {p:"Estudié cómo funcionan las suscripciones en Latinoamérica: conviven las suscripciones con tarjeta, los débitos automáticos de bancos para servicios básicos y modelos nuevos desde cuenta, como Pix Automático en Brasil o los pagos entre cuentas en Colombia. Y recorrí los flujos reales de billeteras, bancos y apps de la región."},
      {fig:img("suscripciones/benchmark","Benchmark y desk research: 4 aprendizajes","1600×1000",{free:true})},
      {p:"La conclusión más importante: la gente no reclama porque le cobren, reclama porque no sabe quién le está cobrando o no encuentra cómo detenerlo."}]},
    {h:"La solución", blocks:[
      {p:"El flujo empieza en la app del comercio, salta a Deuna para autorizar y vuelve al comercio. El usuario vincula una vez y después paga sin salir de la app."},
      {video:{src:"suscripciones/vinculacion-video",label:"Recorrido: del comercio a Deuna y de vuelta"}},
      {fig:img("suscripciones/flujo","Vinculación en cinco pasos","1600×1000",{free:true})}]},
    {h:"Decisiones de diseño", blocks:[
      {finding:["Tokenizar es un concepto técnico que asusta, y el miedo principal era que vincular generara un cobro.","Hablamos de “vincular cuenta”, una acción que la gente ya conoce, y la pantalla dice desde el inicio “Este paso no genera ningún cobro”."]},
      {finding:["En el benchmark, el momento de autorizar es donde se gana o se rompe la confianza.","Una pantalla dedicada solo a eso: quién cobra, tres beneficios claros (pagos seguros, saldo disponible, control total) y la aceptación explícita de términos antes de habilitar el botón."]},
      {finding:["El salto entre la app del comercio y Deuna genera desconfianza.","Siempre se ve qué comercio pide el permiso, la entrada a Deuna dice para qué estás ingresando y la confirmación te devuelve directo al comercio."]},
      {finding:["En el benchmark, suscripción y pago recurrente se usaban como si fueran lo mismo.","Cada tipo tiene su descripción, su jerarquía y su estado: fijo y periódico, o variable según el uso."]},
      {fig:img("suscripciones/estados","Antes de aceptar, error y confirmación","1600×1000",{free:true})},
      {p:"Y los casos que nadie ve: sesión inválida, cuenta ya vinculada, errores temporales y permanentes, y la espera de respuesta. Cada uno le dice al usuario qué pasó y le deja volver al comercio sin quedarse atrapado."}]},
    {h:"Control visible", blocks:[
      {p:"Si la gente reclama porque no sabe quién le cobra, la respuesta es un lugar donde verlo. En Perfil → Comercios vinculados el usuario ve dónde está vinculada su cuenta y puede desvincularla en dos toques, con un aviso de lo que pierde antes de confirmar. Después recibe una notificación y un correo de respaldo."},
      {fig:img("suscripciones/control","Comercios vinculados y desvinculación","1600×1000",{free:true})}]},
    {h:"Medición desde el día uno", blocks:[
      {p:"Cada pantalla del flujo tiene sus eventos definidos: entrada, ingreso a Deuna, aceptación, errores, confirmación y desvinculación. Así el embudo está listo para saber dónde se cae la gente desde el primer comercio integrado."}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Un permiso de cobro es una relación, no una transacción. Diseñar la salida (ver, desvincular, entender qué pasó) fue tan importante como diseñar la entrada."}]},
  ],
  impact:{big:"Pagos recurrentes sin tarjeta", p:"Un nuevo método de pago recurrente para los comercios del ecosistema Deuna, pensado para integrar muchos comercios y con el embudo de medición listo desde el día uno."}
},

{
  id:"datafonos", noSlots:true, title:"Datáfonos para micros y pymes",
  card:"Conjoint con 576 comercios: negocio compró los datáfonos que recomendamos",
  lead:"Descubrimos que el problema no era el precio del datáfono, sino que nadie se lo había ofrecido a los comercios.",
  tags:["Research","Encuesta conjoint","Estrategia"], year:"2025", status:"Investigación",
  meta:[["Rol","Product Designer · research en dupla con Diana Rivadeneira"],["Equipo","UX Research, producto, negocio y marketing"],["Métodos","Desk research, benchmark y encuesta conjoint"],["Muestra","576 comercios (70% micro, 30% pyme)"]],
  summary:[["El reto","Deuna quería vender datáfonos a sus comercios y tenía 5 modelos candidatos, pero no sabía cuál comprar ni cómo cobrarlo antes de invertir en inventario."],["Qué hice","Desk research, benchmark de 7 proveedores en LATAM y una encuesta con análisis conjoint, piloteada con 17 comercios antes de lanzarla a 576."],["Resultado","Negocio compró los datáfonos que recomendamos: cinco recomendaciones, cada una atada a un hallazgo, sobre portafolio, precio y forma de venta."]],
  cover:img("datafonos/cover","Barreras de los comercios y datos clave de la encuesta"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Deuna quería vender datáfonos a sus comercios para que aceptaran pagos con tarjeta, sumando ingresos y adopción. Negocio ya tenía 5 modelos candidatos, con precios entre $36,50 y $200, y necesitaba saber cuál comprar y cómo cobrarlo antes de invertir en inventario."},
      {p:"El riesgo era real: en otros mercados, los datáfonos baratos se adoptan rápido y luego quedan en un cajón. Y en Ecuador el efectivo todavía domina el comercio de barrio."},
      {p:"La pregunta: ¿qué datáfono, a qué precio y con qué modalidad de pago adoptaría cada tipo de comercio? La convertimos en cuatro objetivos: entender motivaciones y barreras, identificar los atributos indispensables, medir qué combinación elegiría cada segmento y saber si pedir RUC sería una barrera."}]},
    {h:"Proceso", blocks:[
      {p:"Trabajamos en tres fases, y cada una afinó las preguntas de la siguiente."},
      {h3:"1. Desk research y benchmark"},
      {p:"Mapeamos el mercado de POS en LATAM y comparamos 7 proveedores: modelos, precios, comisiones y a qué segmento apunta cada uno. Salió una primera hipótesis: el portafolio debía crecer con el comercio, del lector Bluetooth al SmartPOS."},
      {fig:img("datafonos/benchmark","Benchmark de proveedores e hipótesis de portafolio","1600×1000",{free:true})},
      {h3:"2. Diseño de la encuesta"},
      {p:"Dos ramas: comercios con datáfono (qué los motivó, qué les duele) y sin datáfono (por qué no lo tienen). Luego, un ranking de atributos y un análisis conjoint con los 5 modelos reales, combinando apariencia, precio, modalidad de compra y medios de pago."},
      {p:"Por qué conjoint: preguntar “¿qué te importa más?” lleva a que todos digan “el precio”. El conjoint obliga a elegir entre paquetes completos y revela cuánto pesa cada atributo en la decisión real."},
      {h3:"3. Piloto, lanzamiento y análisis"},
      {p:"Probamos la encuesta con 17 comercios: 16 la terminaron en 6 a 15 minutos. Ajustamos el lenguaje de comisión vs. pago por uso, que generaba confusión, y la lanzamos a 576 comercios. Segmentamos los resultados en FigJam."},
      {stats:[["576","comercios encuestados"],["78%","no tiene datáfono"],["8/10","de ellos nunca recibió una oferta"],["44%","prefiere tarifa mensual fija"]]}]},
    {h:"Hallazgos", blocks:[
      {finding:["Asumíamos que el precio frenaba la compra.","La principal barrera es no conocer los beneficios de aceptar tarjeta (35%), por encima del costo del equipo (30%) y las comisiones (20%). La demanda existe, pero nadie la está atendiendo."]},
      {finding:["Temíamos que el datáfono quedara en un cajón.","Quien lo adopta se queda: el 51% lleva más de 2 años. Lo compraron para cobrar con tarjeta (69%), agilizar el cobro (56%) y verse más profesionales (49%)."]},
      {fig:img("datafonos/barreras","El dolor de quien ya lo usa es el costo, no la experiencia","1600×1000",{free:true})},
      {finding:["Casi todo el mercado cobra un porcentaje por venta.","Los comercios prefieren un cobro predecible: tarifa mensual fija 44%, porcentaje por venta 29%, escalonado 20%."]},
      {finding:["Asumíamos que aceptar QR sería un diferenciador.","En el conjoint, la apariencia fue el atributo de mayor peso, seguida del precio. El QR no sumó valor en ningún segmento."]},
      {p:"No hay un solo datáfono para todos: encontramos dos perfiles fuertes, alimentación y retail, ambos de 2 a 5 empleados y sin datáfono, cada uno con un paquete óptimo distinto. Y el RUC no frena: el 85% ya lo tiene."},
      {fig:img("datafonos/hallazgos","Síntesis de hallazgos","1600×1000",{free:true})}]},
    {h:"Recomendaciones", blocks:[
      {p:"Llevamos a negocio cinco recomendaciones, cada una atada a un hallazgo:"},
      {ul:["<b>Vender educando:</b> la fuerza comercial explica el beneficio de aceptar tarjeta antes de ofrecer el equipo.","<b>Tarifa mensual fija</b> como opción principal: la comisión por venta genera miedo a cobros excesivos.","<b>Un paquete por perfil:</b> el modelo con pago a cuotas para el segmento grande, más un modelo básico de $40.","<b>No vender el QR como diferenciador:</b> comunicar precio, modalidad y depósito inmediato.","<b>Mantener el comprobante impreso</b> y estudiar qué haría confiable uno digital."]},
      {p:"A favor de la fuerza comercial: Deuna ya registra el segmento de cada comercio al afiliarlo, así que puede ofrecer de entrada el modelo con más probabilidad de compra."}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Lo que la gente dice no es lo que elige: en las preguntas directas el costo era la gran barrera; en el conjoint, la apariencia pesó más que el precio. Medir elecciones entre paquetes cambió la recomendación."},
      {p:"El piloto se pagó solo: con 17 comercios detectamos la confusión entre “comisión” y “pago por usar el dispositivo” antes de llegar a 576. Lo que haría distinto: fotos realistas de los 5 modelos, porque dos se veían “de juguete”, y más pymes medianas en la muestra."},
      {p:"Esta investigación abrió una segunda pregunta: si un celular con Tap to Phone podía reemplazar al datáfono para los micros. La exploramos con una nueva encuesta conjoint a 382 comercios."}]},
  ],
  impact:{big:"Compra decidida", p:"Negocio compró los datáfonos que recomendamos: una decisión de portafolio, precio y modalidad de cobro basada en lo que 576 comercios eligieron, no en lo que dijeron."}
},

{
  id:"gasolineras", noSlots:true, title:"Pago en gasolineras",
  card:"Una nueva comisión de $0,23 diseñada con datos de 547 conductores",
  lead:"Deuna iba a cobrar una comisión de $0,23 en gasolineras. Antes de lanzarla, medimos qué tanto podía romper la preferencia de los usuarios y diseñamos el pago para que el costo se entienda antes de pagar.",
  tags:["App","Pagos","Research"], year:"2026", status:"En desarrollo",
  meta:[["Rol","Product Designer · research con Diana Rivadeneira"],["Método","Encuesta con dos rutas"],["Muestra","547 conductores (309 + 238)"],["Plataforma","App Deuna"]],
  summary:[["El reto","Negocio quería subir el MDR con una comisión de $0,23 por pago en gasolineras, la misma de las tarjetas, sin perder a quienes hoy prefieren Deuna justamente porque no cobra."],["Qué hice","Encuesta a 547 conductores, con y sin experiencia pagando con Deuna, y el flujo de pago en alta fidelidad con la comisión, su explicación y todos los estados de error."],["Resultado","Recomendaciones para lanzar la comisión con una estrategia de compensación, y un pago que muestra el costo antes de confirmar."]],
  cover:img("gasolineras/cover","Pago en gasolinera: monto, costo de la comisión y comprobante"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"En las gasolineras de Ecuador se puede pagar con Deuna escaneando un QR estático en el surtidor. Para muchos usuarios es la forma preferida de pagar: rápida, sin efectivo y sin la comisión que cobran las tarjetas."},
      {p:"Negocio quería aumentar los ingresos por MDR cobrando $0,23 por pago en gasolineras, lo mismo que se cobra con tarjeta. La pregunta era incómoda: ¿cuántos usuarios dejarían de usar Deuna por esa comisión, y qué podría compensarlo?"}]},
    {h:"Investigación", blocks:[
      {p:"Hicimos una encuesta a conductores que cargan gasolina con frecuencia, con dos rutas: quienes ya pagan con Deuna (qué los motiva, qué los haría dejarlo) y quienes no (qué los frena, qué los haría probar)."},
      {stats:[["547","respuestas"],["56%","ya ha pagado con Deuna"],["97%","de ellos dice que es fácil"],["65%","de ellos lo dejaría si tiene costo"]]},
      {fig:img("gasolineras/hallazgos","Síntesis de la encuesta","1600×1000",{free:true})}]},
    {h:"Hallazgos", blocks:[
      {finding:["Quienes pagan con Deuna lo prefieren por rapidez y por no pagar comisión.","El 99% lo ve mejor que la tarjeta. La comisión toca justo el beneficio que sostiene esa preferencia: el 65% de quienes ya pagan con Deuna lo dejaría si tuviera costo."]},
      {finding:["La fricción de quienes no lo usan no está en “cómo se paga”, sino en “dónde y cuándo”.","El 42% no sabía que se podía pagar con Deuna en gasolineras y el 53% dice que en su estación solo a veces, rara vez o nunca se puede."]},
      {fig:img("gasolineras/competidor","El competidor es el efectivo","1600×1000",{free:true})},
      {finding:["El principal competidor no son las tarjetas, es el efectivo.","Cobrar la comisión no nos pone “en la misma cancha” que las tarjetas: nos pone en desventaja frente a un método sin ningún costo."]},
      {finding:["Hay una ventana para mitigar el impacto.","El 86% de quienes no usan Deuna se sentiría cómodo pagando con ella y el 61% cambiaría de método si recibe beneficios."]}]},
    {h:"Recomendaciones", blocks:[
      {p:"La comisión no puede salir sola: necesita una estrategia de compensación. Propusimos tres alternativas para el programa de beneficios:"},
      {ul:["<b>Beneficios por nivel de usuario:</b> consumos de gasolina sin comisión al mes, más consumos al subir de nivel.","<b>Incentivo por ticket:</b> si el usuario carga dos veces más de $25, la siguiente no paga comisión.","<b>Beneficio por frecuencia:</b> cada 4 pagos con Deuna, el siguiente no paga comisión."]},
      {p:"Y corregir las barreras actuales antes de cobrar: material POP más visible, el QR en un lugar accesible para el conductor y personal de las estaciones capacitado. A mediano plazo, evaluar pagos sin internet: el 34% dejaría Deuna si el pago depende de tener conexión."}]},
    {h:"La solución", blocks:[
      {p:"Diseñé el pago con la comisión visible desde el primer momento. En la pantalla del monto aparece “Costo de comisión $0,23” con un acceso a más información, la confirmación separa el total del costo y el usuario acepta de forma explícita que se debite."},
      {video:{src:"gasolineras/pago-video",label:"Recorrido: del QR al comprobante"}},
      {fig:img("gasolineras/flujo","Pago en gasolinera con QR estático","1600×960",{free:true})},
      {p:"Un pago en el surtidor no puede quedarse colgado. Definí el orden de los errores, de fondos insuficientes a límites diarios, mensuales y transaccionales, timeout y error genérico, cada uno con qué pasó y qué hacer."},
      {fig:img("gasolineras/estados","Saldo, límites y errores","1600×1000",{free:true})}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Un cobro nuevo no es solo un número en la pantalla: cambia el valor que la gente le da al producto. Medir ese quiebre antes de lanzar le dio a negocio una forma de cobrar sin perder a quienes más nos prefieren."}]},
  ],
  impact:{big:"547 conductores", p:"Datos para decidir cómo lanzar la comisión, con un programa de beneficios y un pago donde el costo se entiende antes de confirmar."}
},

{
  id:"back-office", noSlots:true, title:"Back Office comercial Deuna",
  card:"Evolución de la herramienta interna con la que el equipo comercial gestiona unos 10.000 comercios",
  lead:"La plataforma interna donde los asesores comerciales de Deuna afilian comercios, generan sus QR y les dan acceso al portal. Me sumé para mantenerla, evolucionarla y conectarla con el Portal Deuna Negocios.",
  tags:["Herramienta interna","B2B","Operaciones"], year:"2024–2026", status:"En producción",
  meta:[["Rol","Senior Product Designer"],["Empresa","Neoris para Deuna (Ecuador)"],["Usuarios","Asesores comerciales"],["Plataforma","Web interna"]],
  summary:[["El reto","Una herramienta ya en uso por la fuerza de ventas, con unos 10.000 comercios, que tenía que crecer sin frenar la operación."],["Qué hice","Mantenimiento y nuevas funcionalidades: creación masiva de pymes, QR por sucursal y QR masivos, configuración general del comercio y la gestión de cuentas que da acceso al portal."],["Resultado","Un back office que alimenta al portal: lo que el asesor configura es lo que el comercio ve y gestiona por su cuenta."]],
  cover:img("backoffice/cover","Back office: sucursales de un comercio y generación de QR"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Cada comercio que cobra con Deuna entra por el back office. Los asesores comerciales, la fuerza de ventas de Deuna, consiguen el comercio y lo afilian desde ahí: lo crean, arman su estructura de sucursales y cajas, configuran cómo cobra y le entregan sus QR."}]},
    {h:"Mi rol", blocks:[
      {p:"No diseñé el back office desde cero: llegué con la plataforma en producción. Me encargué de su mantenimiento y evolución, con funcionalidades nuevas para que el equipo comercial afilie más rápido, y de diseñar la conexión con el Portal Deuna Negocios."},
      {video:{src:"backoffice/backoffice-video",label:"Recorrido: afiliados, creación masiva, QR y acceso al portal"}}]},
    {h:"Creación masiva de pymes", blocks:[
      {p:"Afiliar pymes una por una no escalaba. El asesor ahora descarga una plantilla, la carga y el sistema valida el formato antes de crear los negocios. Si hay errores, se muestran por fila para corregirlos sin perder la carga, y se distinguen la carga completa, la parcial y la fallida."},
      {fig:img("backoffice/masiva","Carga masiva: subir el archivo y validar el formato","1600×860",{free:true})}]},
    {h:"QR por sucursal y QR masivos", blocks:[
      {p:"Cada sucursal y cada caja necesita su QR. Desde la ficha del comercio, el asesor selecciona sucursales, previsualiza el QR con o sin la plantilla de Deuna, elige el tamaño y lo descarga para imprimir."},
      {p:"Para afiliar en campo, el equipo crea campañas de QR masivos: hasta 1.000 códigos por lote que se activan cuando se asignan a un negocio, con el estado de activos e inactivos de cada campaña."},
      {fig:img("backoffice/qr","QR por sucursal y campañas de QR masivos","1600×1000",{free:true})}]},
    {h:"Conexión con el portal", blocks:[
      {p:"El acceso al Portal Deuna Negocios nace en el back office. En la configuración general del comercio, junto a los métodos de pago y las integraciones, diseñé la gestión de cuentas: el asesor agrega los correos que tendrán acceso, les asigna un rol (maestro o desarrollador) y ve el estado de cada invitación, con la opción de reenviarla si caducó."},
      {fig:img("backoffice/cuentas","Gestión de cuentas: el acceso del comercio al portal","1600×860",{free:true})},
      {p:"Ese fue el primer paso hacia roles y permisos: después, el propio comercio pudo invitar y gestionar a su equipo desde el portal, sin pedírselo al asesor."}]},
    {h:"Qué gestiona la plataforma", blocks:[
      {fig:img("backoffice/modulos","Módulos del back office comercial","1600×760",{free:true})}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Mantener un producto en producción es diseñar con restricciones reales: cada mejora tiene que convivir con lo que el equipo ya usa todos los días."}]},
  ],
  impact:{big:"≈10.000 comercios", p:"Gestionados por el equipo comercial desde el back office, conectado con el portal de autogestión."}
},
{
  id:"colombia-fintech", noSlots:true, title:"Colombia Fintech",
  card:"Rediseño del sitio del gremio fintech más importante del país",
  lead:"Del repositorio de información a la puerta de entrada del ecosistema fintech colombiano.",
  tags:["Sitio web","Arquitectura de información","Freelance"], year:"2025", status:"Publicado",
  meta:[["Rol","Product Designer"],["Equipo","Producto, stakeholders del gremio y agencia de marca"],["Plataforma","Sitio web"],["Estado","Publicado en 2025"]],
  summary:[["El problema","El sitio tenía todo apilado con el mismo peso: quien quería afiliarse tenía que buscar cómo hacerlo entre noticias y documentos."],["Qué hice","Rediseñé la arquitectura de información, los flujos de navegación y la experiencia completa con la nueva marca."],["Resultado","Sitio publicado en 2025, con la afiliación y la comunidad al frente."]],
  cover:img("colombia-fintech/cover","Sitio de Colombia Fintech en desktop y móvil"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Colombia Fintech reúne a bancos digitales, fintechs, aliados e inversionistas. Su sitio era donde todos ellos llegaban primero, y no le hablaba a ninguno."},
      {p:"Todo estaba ahí, pero apilado: noticias, eventos, afiliación y documentos con el mismo peso. Quien llegaba con ganas de afiliarse tenía que buscar cómo hacerlo entre noticias y documentos."},
      {pair:[img("colombia-fintech/antes","Sitio anterior","1200×900",{remote:"https://framerusercontent.com/images/jVe34Z1NWNzfKvcOP3x2ZMCMZc.png"}),img("colombia-fintech/despues","Sitio nuevo","1440×900")]}]},
    {h:"El reto", blocks:[
      {p:"Llevar la nueva identidad de marca, creada por un equipo externo, a un sitio que en pocos segundos le dijera a cada visitante qué gana con Colombia Fintech y dónde seguir."}]},
    {h:"Mi rol", blocks:[
      {p:"Rediseñé la arquitectura de información y los flujos de navegación, y diseñé la experiencia de punta a punta hasta el prototipo de alta fidelidad. Trabajé con producto, con los stakeholders del gremio y con la agencia que hizo la marca."}]},
    {h:"El rediseño", blocks:[
      {finding:["Afiliarse, el objetivo principal del gremio, era un enlace perdido.","“Vinculación” en el menú principal y un bloque propio en el inicio para unirse a la comunidad."]},
      {finding:["El valor de pertenecer no se veía.","Directorio de miembros y testimonios de líderes del sector en el inicio."]},
      {finding:["Eventos, cursos y webinars estaban mezclados en un solo listado.","Pestañas por tipo de contenido y más aire entre bloques."]},
      {video:{src:"colombia-fintech/sitio-video",label:"Recorrido por el sitio publicado"}},
      {h3:"Afiliación y comunidad al frente"},
      {p:"“Vinculación” vive en el menú principal, y el inicio tiene su propio bloque para unirse a la comunidad fintech más grande de Colombia. Unirse dejó de ser un enlace perdido."},
      {p:"El directorio de miembros y los testimonios de líderes del sector están en el inicio: el valor de pertenecer se ve antes de leerlo."},
      {fig:img("colombia-fintech/afiliacion","Beneficios y bloque para unirse a la comunidad","1600×1300",{free:true})},
      {fig:img("colombia-fintech/comunidad","Directorio de miembros y testimonios","1600×1260",{free:true})},
      {h3:"Traduciendo la marca a producto digital"},
      {p:"Eventos, cursos, Fintech & Beer y webinars quedaron en pestañas, en lugar de un listado mezclado. La identidad nueva era fuerte: la usé para dar ritmo y jerarquía, no para decorar. Más aire, menos bloques compitiendo."},
      {fig:img("colombia-fintech/eventos","Eventos por tipo, en desktop y móvil","1600×1000",{free:true})}]},
  ],
  impact:{big:"Sitio publicado", p:"En uso por el gremio fintech más importante de Colombia."},
  link:{href:"https://colombiafintech.co", label:"Ver sitio"}
},
{
  id:"credito-facil-codensa", noSlots:true, title:"Crédito Fácil Codensa",
  card:"Web, app y design system para gestionar una tarjeta de crédito sin llamar al call center",
  lead:"Rediseño de la web y la app de Crédito Fácil Codensa para que los clientes consulten, paguen, bloqueen su tarjeta y pidan un préstamo por su cuenta.",
  tags:["Fintech","Web y app","Design System"], year:"2021–2022", status:"Consultoría",
  meta:[["Rol","Product Designer"],["Empresa","NTT DATA para Crédito Fácil Codensa (Enel · Scotiabank Colpatria)"],["Plataforma","Web responsive y app móvil"],["Equipo","3 diseñadores"]],
  summary:[["El problema","Para consultar el cupo, ver movimientos, pagar o bloquear la tarjeta, muchos clientes tenían que llamar o ir a un punto físico."],["Qué hice","Arquitectura de información con card sorting, wireframes, diseño de web y app, encuesta de satisfacción y design system."],["Resultado","Una sola experiencia en web y app, construida con los mismos componentes y con una forma de medir la satisfacción dentro del producto."]],
  cover:img("cfc/mock-home","Tus productos en web y móvil","1600×1000",{free:true}),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Crédito Fácil Codensa es la tarjeta de crédito que los clientes de Enel pagan junto con su factura de energía, respaldada por Scotiabank Colpatria. Muchos de sus usuarios no son expertos en banca digital y la plataforma anterior los obligaba a llamar para lo más básico."}]},
    {h:"Mi rol y equipo", blocks:[
      {p:"Trabajé con otros dos diseñadores en NTT DATA, con el equipo del cliente y desarrollo. Participé en todo el proceso: research, arquitectura de información, wireframes, diseño visual, design system y piezas para las tiendas de apps."}]},
    {h:"Arquitectura de información", blocks:[
      {p:"Antes de dibujar pantallas hicimos card sorting para entender cómo los usuarios agrupaban las tareas. El resultado mostró tres grupos claros:"},
      {ul:["Mover dinero: retirar, transferir, pagar facturas y pagar tarjetas.","Consultar mis productos: saldo, movimientos, número de cuenta, documentos.","Pedir ayuda: preguntas frecuentes, ayuda y notificaciones."]},
      {fig:img("cfc/arquitectura","Card sorting: matriz de similitud y agrupación de categorías","1600×1000",{free:true})}]},
    {h:"Decisiones clave", blocks:[
      {finding:["Los usuarios buscaban primero su tarjeta y su próximo pago.","Un home que muestra producto, pago oportuno y últimos movimientos sin navegar."]},
      {finding:["Bloquear la tarjeta por robo o pérdida era una urgencia que hoy pasaba por el call center.","Un flujo de bloqueo de tres pasos con motivo, confirmación y comprobante."]},
      {finding:["El cliente no tenía forma de decir si la web le servía.","Una encuesta corta de cuatro pasos al terminar una gestión, para medir recomendación, solución y facilidad."]}]},
    {h:"Wireframes", blocks:[
      {p:"Validamos los flujos en baja fidelidad antes del diseño visual. Este es el bloqueo de tarjeta: elegir el motivo, confirmar y recibir el comprobante."},
      {fig:img("cfc/wireframes","Wireframes del flujo de bloqueo de tarjeta","1600×1220",{free:true})}]},
    {h:"La solución", blocks:[
      {h3:"Tus productos, en una sola vista"},
      {p:"Tarjeta, cupo disponible, pago oportuno, últimos movimientos y préstamo personal en la primera pantalla. En móvil se mantiene la misma jerarquía."},
      {h3:"Encuesta de satisfacción"},
      {p:"Cuatro preguntas con progreso visible y respuestas rápidas (caritas, sí/no, escala) para que contestar tome segundos."},
      {video:{src:"cfc/encuesta-video",label:"Recorrido: los cuatro pasos de la encuesta"}},
      {fig:img("cfc/mock-encuesta","Paso 1: recomendación de 0 a 10","1600×1000",{free:true})},
      {fig:img("cfc/encuesta-flujo","Pasos 2 a 4 y confirmación","1600×1200",{free:true})},
      {h3:"Design system"},
      {p:"Botones, campos, iconografía, tarjetas por tipo de producto y estados. Web y app salieron de las mismas piezas, lo que aceleró desarrollo y mantuvo la consistencia."},
      {fig:img("cfc/design-system","Componentes del design system","1600×1000",{free:true})},
      {h3:"Lanzamiento en tiendas"},
      {fig:img("cfc/store","Piezas para App Store y Google Play","1600×1000",{free:true})}]},
    {h:"Qué aprendí", blocks:[
      {learn:"Con usuarios poco digitales, la arquitectura pesa más que la interfaz: si la tarea está donde la persona la busca, no necesita ayuda."}]},
  ],
  impact:{big:"Web + app + design system", p:"Una experiencia consistente para consultar, pagar, bloquear la tarjeta y pedir crédito, con la satisfacción medida dentro del producto."}
},
{
  id:"porvenir-app", noSlots:true, title:"App Porvenir",
  card:"App de pensiones y cesantías basada en 14 entrevistas y validada con 11 afiliados",
  lead:"Diseño de la app de Porvenir para que los afiliados consulten y muevan sus pensiones voluntarias, obligatorias y cesantías sin depender de un asesor.",
  tags:["Fintech","App","Research"], year:"2021", status:"Consultoría",
  meta:[["Rol","Product Designer"],["Empresa","NTT DATA para Porvenir"],["Plataforma","App móvil"],["Equipo","3 diseñadores"]],
  summary:[["El problema","Los afiliados usaban la web, la oficina o el asesor para trámites simples, y no entendían conceptos como saldo consolidado."],["Qué hice","Workshop de visión, 14 entrevistas, arquitectura, wireframes, diseño visual y pruebas de usabilidad."],["Resultado","Puntaje SUS en el rango aceptable con 11 afiliados y hallazgos concretos para ajustar antes de desarrollo."]],
  cover:img("porvenir/mock-producto","Cesantías: cuentas, saldo y movimientos","1600×1000",{free:true}),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Porvenir administra pensiones y cesantías de millones de colombianos. La app debía integrar los servicios existentes, dar más autoservicio en las consultas y transacciones frecuentes, y acercar a Porvenir a sus afiliados."}]},
    {h:"Mi rol y equipo", blocks:[
      {p:"Trabajé con otros dos diseñadores en NTT DATA. Participé en el workshop con el negocio, las entrevistas, la arquitectura de información, los wireframes, el diseño visual y las pruebas de usabilidad."}]},
    {h:"Workshop de visión", blocks:[
      {p:"Con el negocio hicimos el ejercicio de “titulares del futuro”: escribir la noticia que saldría en el periódico si la app fuera un éxito. De ahí salieron los valores y funcionalidades clave."},
      {ul:["Valores: acompañamiento permanente, facilidad de acceso, seguridad, agilidad y omnicanalidad.","Funcionalidades: ver portafolios, transacciones, certificados y extractos, vinculación a productos y autenticación biométrica."]}]},
    {h:"Entrevistas", blocks:[
      {stats:[["14","afiliados entrevistados"],["3–27","años de afiliación"],["9","sesiones en 3 días"],["50 min","por sesión"]]},
      {p:"Hablamos con afiliados de pensiones obligatorias, voluntarias y cesantías. Lo que encontramos:"},
      {ul:["Quienes tienen pensión voluntaria la usan para ahorrar, pero no saben que pueden elegir otras inversiones.","Quieren ver en tiempo real cómo se comporta su inversión y depender menos del asesor.","Prefieren hacer certificados y extractos en digital, sobre todo para la declaración de renta.","Valoran todo lo que les evite ir a una oficina, aunque aún desconfían de los trámites con dinero."]},
      {quotes:[["Prefiero hacer la descarga de mis certificados por web que por app. No es tan urgente como para descargarla en la app.","Luca, empresario"],["Sería útil hacerlo por la app, sería genial y mucho más sencillo.","Jorge, gestión de almacenes"],["Tengo reunión mensual con mi financial planner, ahí revisamos el tema de inversiones.","Edgar, ingeniero mecánico"]]}]},
    {h:"Wireframes", blocks:[
      {p:"Diseñamos los flujos principales en baja fidelidad. El retiro de pensiones voluntarias se dividió en cuatro pasos visibles (objetivo, portafolio, forma de retiro y revisión) para que el afiliado sepa siempre dónde está."},
      {fig:img("porvenir/wireframes","Wireframes del retiro de pensiones voluntarias","1600×1000",{free:true})}]},
    {h:"La solución", blocks:[
      {h3:"Home con accesos directos"},
      {p:"Las cuatro tareas más frecuentes (transferir, retirar, certificados y extractos) quedan arriba y debajo todos los productos con su saldo."},
      {video:{src:"porvenir/app-video",label:"Recorrido por la app: home, cuentas, saldo y movimientos"}},
      {fig:img("porvenir/mock-movimientos","Home y movimientos","1600×1000",{free:true})},
      {h3:"Entender el dinero"},
      {p:"El detalle de cada producto separa aportes y rendimientos, y muestra cómo está invertido. Los movimientos se leen como una lista con fecha, tipo y monto."}]},
    {h:"Pruebas de usabilidad", blocks:[
      {stats:[["11","afiliados"],["5 días","de pruebas remotas"],["45 min","máximo por sesión"],["SUS","en rango aceptable"]]},
      {p:"Probamos el prototipo navegable en remoto con Lookback, con tareas definidas con el Product Owner. En general la app gustó y se percibió fácil, y aparecieron tres problemas para corregir:"},
      {finding:["Usuarios con varias cuentas de cesantías no entendían por qué aparecían varias.","Explicar el origen de cada cuenta y agruparlas por administradora."]},
      {finding:["Algunos no notaban que cada movimiento tenía detalle.","Hacer más evidente el acceso al detalle de cada movimiento."]},
      {finding:["Saldo consolidado, no consolidado y total eran conceptos muy técnicos, y la ayuda no los aclaraba.","Reescribir los términos en lenguaje simple y mejorar la ayuda contextual."]}]},
    {h:"Qué aprendí", blocks:[
      {learn:"La interfaz puede ser clara y aun así fallar por el lenguaje. En productos financieros, revisar los términos con usuarios es tan importante como revisar el flujo."}]},
  ],
  impact:{big:"14 entrevistas · 11 pruebas", p:"Una app diseñada desde lo que los afiliados necesitan y validada con usuarios reales antes de pasar a desarrollo."}
},
{
  id:"movistar-empresas", noSlots:true, title:"Movistar Empresas B2B",
  card:"Portal de autogestión para que las empresas manejen sus líneas y pidan soporte sin un asesor",
  lead:"Portal web para que los clientes empresariales de Movistar consulten sus cuentas y líneas, y creen solicitudes de soporte por su cuenta.",
  tags:["B2B","Web","Autogestión"], year:"2022", status:"Consultoría",
  meta:[["Rol","Product Designer"],["Empresa","NTT DATA para Movistar Empresas (Telefónica)"],["Plataforma","Web B2B"],["Equipo","Diseño a mi cargo"]],
  summary:[["El problema","Las empresas manejan decenas de NITs y líneas, y cualquier consulta o requerimiento pasaba por un asesor."],["Qué hice","Benchmark de portales de telcos, arquitectura del portal y diseño de la home, el detalle de cuenta y la ayuda en línea."],["Resultado","Un portal donde el cliente encuentra su cuenta, revisa sus líneas y crea un ticket en cuatro pasos."]],
  cover:img("movistar/mock-home","Home: empresas y NITs del cliente","1600×1000",{free:true}),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Un cliente empresarial de Movistar puede tener muchas razones sociales (NITs) y cientos de líneas. Para saber el estado de una línea, el saldo de una cuenta o pedir soporte, dependía de su asesor comercial."}]},
    {h:"Mi rol", blocks:[
      {p:"Fui la diseñadora del proyecto: hice el benchmark, definí la estructura del portal y diseñé las pantallas de home, detalle de cuenta y ayuda en línea con el equipo de Movistar y desarrollo."}]},
    {h:"Benchmark", blocks:[
      {p:"Revisé cómo resolvían la autogestión Virgin, Claro, Mi Tigo y ETB. Tomamos tres ideas: búsqueda como punto de entrada, información de la cuenta siempre visible y procesos de soporte guiados por pasos."},
      {fig:img("movistar/benchmark","Benchmark de portales y apps de telcos","1600×1200",{free:true})}]},
