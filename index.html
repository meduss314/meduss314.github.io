<style>
/* Layout: one column of work. Home = hero + "comprobante" of results + case grid; each case = receipt-style meta card, then story with image slots. */
:root{
  --bg:#f5f8fc; --surface:#ffffff; --ink:#122036; --muted:#5a6a80; --line:#dbe4ef;
  --accent:#1679c9; --accent-soft:#dcedfc; --paper:#fbf6e6; --ok:#1d8a5b;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --wrap:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --surface:#131d2e; --ink:#e7eef7; --muted:#9aabc2; --line:#24324a;
  --accent:#5fb8ff; --accent-soft:#16304d; --paper:#1b2433; --ok:#52c48f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1320; --surface:#131d2e; --ink:#e7eef7; --muted:#9aabc2; --line:#24324a;
  --accent:#5fb8ff; --accent-soft:#16304d; --paper:#1b2433; --ok:#52c48f; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--ink); font:16px/1.6 var(--body); margin:0}
a{color:inherit}
img{max-width:100%; display:block}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:-.02em}
p{margin:0}
.eyebrow{font:500 12px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

/* header */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px}
.brand{font:700 17px/1 var(--display); text-decoration:none; display:flex; align-items:center; gap:10px}
.brand i{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block}
nav.links{display:flex; gap:22px; align-items:center; font-weight:500; font-size:15px}
nav.links a{text-decoration:none; color:var(--muted)}
nav.links a:hover{color:var(--ink)}
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; font:600 15px/1 var(--body); text-decoration:none; border:1px solid var(--ink); color:var(--ink); background:transparent; cursor:pointer}
.btn.solid{background:var(--ink); color:var(--bg)}
.btn:hover{transform:translateY(-1px)}
@media (max-width:640px){ nav.links .hide-sm{display:none} nav.links{gap:14px} }

/* hero */
.hero{padding-block:72px 56px; display:grid; grid-template-columns:1.25fr .9fr; gap:48px; align-items:end}
.hero h1{font-size:clamp(40px, 6.4vw, 76px); line-height:.98; font-weight:800}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero .lead{font-size:clamp(18px,2vw,21px); color:var(--muted); max-width:34ch; margin-top:22px}
.hero .ctas{display:flex; gap:12px; flex-wrap:wrap; margin-top:28px}
.status{display:inline-flex; align-items:center; gap:8px; font:500 13px/1 var(--mono); color:var(--ok); margin-bottom:22px}
.status::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent)}

/* receipt */
.receipt{background:var(--paper); border-radius:14px; padding:22px 22px 18px; font-family:var(--mono); font-size:13px; position:relative; box-shadow:0 1px 0 var(--line), 0 18px 40px -24px rgba(18,32,54,.35)}
.receipt::after{content:""; position:absolute; left:0; right:0; bottom:-8px; height:8px;
  background:radial-gradient(circle at 6px 0, transparent 6px, var(--paper) 6.5px) 0 0/12px 8px repeat-x}
.receipt .r-head{display:flex; justify-content:space-between; color:var(--muted); padding-bottom:12px; border-bottom:1px dashed var(--line); margin-bottom:6px}
.receipt .row{display:flex; justify-content:space-between; gap:16px; padding-block:9px; border-bottom:1px dashed var(--line)}
.receipt .row:last-child{border-bottom:0}
.receipt .row span:first-child{color:var(--muted)}
.receipt .row b{font:600 18px/1 var(--display); letter-spacing:-.01em; font-variant-numeric:tabular-nums; white-space:nowrap}
.receipt .code{font:500 22px/1 var(--mono); letter-spacing:.18em; color:var(--accent)}

/* sections */
section.block{padding-block:56px; border-top:1px solid var(--line)}
.sec-head{display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap; margin-bottom:28px}
.sec-head h2{font-size:clamp(28px,3.4vw,40px); font-weight:700}

/* case grid */
.grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:28px}
@media (max-width:760px){ .grid{grid-template-columns:1fr} .hero{grid-template-columns:1fr; padding-block:48px 40px} }
.card{display:flex; flex-direction:column; gap:14px; text-decoration:none; color:inherit}
.card .shot{aspect-ratio:16/10}
.card:hover .shot img{transform:scale(1.02)}
.card .meta{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.tag{font:500 12px/1 var(--mono); padding:6px 9px; border-radius:6px; background:var(--accent-soft); color:var(--ink)}
.tag.live{background:transparent; border:1px solid var(--ok); color:var(--ok)}
.card h3{font-size:24px; font-weight:700; line-height:1.15}
.card p{color:var(--muted)}
.card .more{font-weight:600; color:var(--accent)}

/* image slots */
.shot{position:relative; border-radius:12px; overflow:hidden; background:var(--accent-soft); max-width:100%}
.shot img{width:100%; height:100%; object-fit:cover; transition:transform .4s ease}
.shot.free{aspect-ratio:auto}
.shot.free img{height:auto; object-fit:contain}
.shot .ph{position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:6px; padding:16px;
  border:1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius:12px; color:var(--ink); font-size:14px}
.shot.free .ph{position:relative; min-height:220px}
.ph b{font:600 15px/1.3 var(--body)}
.ph code{font:500 12px/1.4 var(--mono); color:var(--accent); word-break:break-all}
.ph small{font:12px/1.3 var(--mono); color:var(--muted)}
figure{margin:0; display:flex; flex-direction:column; gap:10px}
figcaption{font-size:14px; color:var(--muted)}

/* about */
.about{display:grid; grid-template-columns:1fr 1fr; gap:48px}
@media (max-width:760px){ .about{grid-template-columns:1fr} }
.about .text{display:flex; flex-direction:column; gap:16px; max-width:60ch; font-size:17px}
.timeline{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.timeline li{display:grid; grid-template-columns:120px 1fr; gap:16px; padding-block:14px; border-bottom:1px solid var(--line)}
.timeline .when{font:500 13px/1.6 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.timeline b{display:block; font-weight:600}
.timeline span{color:var(--muted); font-size:15px}
.skills{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}

/* contact */
.contact{display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:start}
@media (max-width:760px){ .contact{grid-template-columns:1fr} }
.contact h2{font-size:clamp(30px,4vw,48px); font-weight:800}
.contact dl{margin:0; display:grid; gap:2px}
.contact .item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.contact dt{font:500 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.contact dd{margin:0; font-weight:600; user-select:all; overflow-wrap:anywhere}
footer{padding-block:32px; color:var(--muted); font-size:14px; border-top:1px solid var(--line)}

/* case page */
.case-hero{padding-block:48px 32px}
.back{font-weight:600; text-decoration:none; color:var(--muted); display:inline-flex; gap:8px; margin-bottom:28px}
.back:hover{color:var(--ink)}
.case-hero h1{font-size:clamp(36px,5.6vw,64px); font-weight:800; line-height:1}
.case-hero .lead{font-size:clamp(19px,2.2vw,24px); color:var(--muted); max-width:38ch; margin-top:18px; font-family:var(--display); font-weight:400; letter-spacing:-.01em}
.case-top{display:grid; grid-template-columns:1.4fr .8fr; gap:40px; align-items:start}
@media (max-width:860px){ .case-top{grid-template-columns:1fr} }
.case-body{display:grid; gap:56px; padding-block:24px 64px}
.chapter{display:grid; grid-template-columns:220px minmax(0,1fr); gap:32px}
@media (max-width:860px){ .chapter{grid-template-columns:1fr; gap:14px} }
.chapter > h2{font-size:22px; font-weight:700; position:sticky; top:84px; align-self:start}
@media (max-width:860px){ .chapter > h2{position:static} }
.chapter .content{display:flex; flex-direction:column; gap:18px; min-width:0}
.content p{max-width:66ch; font-size:17px}
.content h3{font-size:19px; font-weight:600; margin-top:8px}
.content ol, .content ul{margin:0; padding-left:22px; display:grid; gap:10px; max-width:66ch; font-size:17px}
.pair{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
@media (max-width:640px){ .pair,.trio{grid-template-columns:1fr} }
.finding{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; padding:16px 18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:72ch}
.finding .k{font:500 12px/1.9 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.impact{background:var(--ink); color:var(--bg); border-radius:16px; padding:32px; display:grid; gap:10px}
.impact .big{font:800 clamp(34px,5vw,56px)/1 var(--display); letter-spacing:-.03em}
.impact p{opacity:.85; max-width:60ch}
.next{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:32px; border-top:1px solid var(--line)}
.next a{text-decoration:none}
.next small{display:block; font:500 12px/1 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px}
.next b{font:700 22px/1.2 var(--display)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; scroll-behavior:auto!important} .btn:hover{transform:none} }
</style>

const LINKEDIN = "https://www.linkedin.com/in/lina-valentina-prieto-acevedo";

const CASES = [
{
  id:"portal-deuna-negocios", title:"Portal Deuna Negocios",
  card:"De 10 comercios piloto a más de 2.000 que se autogestionan",
  lead:"De 10 comercios piloto a más de 2.000 que gestionan su negocio sin llamar a soporte.",
  tags:["B2B","Web","Fintech"], year:"2024–2026", status:"En producción",
  meta:[["Rol","Lead Product Designer"],["Equipo","Product Owner, desarrollo y arquitectura"],["Plataforma","Web B2B"],["Tiempo al MVP","2 meses"],["Estado","En producción"]],
  cover:img("deuna/portada","Portada: pantalla principal del portal"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Deuna es la billetera digital más usada de Ecuador. Mientras más comercios la adoptaban, más crecía un costo invisible: cada pregunta de un comercio terminaba en el equipo comercial."},
      {p:"¿Llegó este pago? ¿Me reenvías el reporte de ayer? ¿Cómo me integro? El equipo comercial dedicaba 4–5 horas diarias a responder. Los desarrolladores senior y el arquitecto, 2–3 horas diarias a soporte de integraciones."}]},
    {h:"El reto", blocks:[
      {p:"No bastaba con diseñar un portal. Había que convencer a la dirección de que no era un gasto más, sino la forma de dejar de pagar ese tiempo todos los días. Y hacerlo con un MVP que saliera en dos meses."},
      {fig:img("deuna/reto","El problema: comercios pidiendo soporte por pagos y reportes","1600×900",{free:true})}]},
    {h:"Mi rol", blocks:[
      {p:"Lideré el diseño de punta a punta, de discovery a QA visual. Construí con el equipo el caso de negocio, definí la arquitectura de información, diseñé y validé los flujos, y acompañé la evolución del producto después del lanzamiento."}]},
    {h:"Lo que descubrimos", blocks:[
      {p:"Antes de dibujar una pantalla, medimos de dónde venía la carga operativa. Tres hallazgos definieron el producto:"},
      {ul:["Los comercios validaban pagos con capturas de pantalla. Al cerrar caja, el cliente mostraba una foto del pago y el comercio llamaba para confirmar.","Los reportes vivían en el correo. Si no llegaban, el comercio no podía cerrar caja y pedía un reenvío.","Las integraciones consumían al equipo técnico. Cada empresa que quería conectarse necesitaba acompañamiento de un desarrollador senior."]},
      {fig:img("deuna/hallazgos","Mapa de hallazgos o arquitectura de información","1600×1000",{free:true})}]},

    {h:"Primer MVP", blocks:[
      {h3:"Transacciones en tiempo real"},
      {p:"El comercio confirma un pago al instante desde el portal, sin pedir capturas ni llamar al equipo comercial. Ventas y devoluciones van separadas, y cada transacción tiene su detalle completo."},
      {fig:img("deuna/transacciones","Pantalla de transacciones","1600×1000",{free:true})},
      {h3:"Historial de reportes"},
      {p:"Los reportes que antes llegaban por correo ahora están siempre disponibles, filtrados por fecha, frecuencia y sucursal. El comercio los descarga cuando los necesita y puede cerrar caja sin esperar a nadie."},
      {fig:img("deuna/reportes","Pantalla de reportes","1600×1000",{free:true})}]},
    {h:"Segunda fase", blocks:[
      {p:"Con el portal en uso, las necesidades de los comercios más grandes marcaron la segunda fase: controlar quién ve qué, e integrarse sin depender del equipo técnico de Deuna."},
      {h3:"Roles y Permisos"},
      {p:"Diseñamos un sistema de accesos para que diferentes perfiles dentro de una empresa pudieran operar el portal con distintos niveles de visibilidad y control, protegiendo información sensible sin afectar la operación diaria."},
      {trio:[img("deuna/roles-1","Roles: listado de usuarios","1200×900"),img("deuna/roles-2","Roles: crear o editar rol","1200×900"),img("deuna/roles-3","Roles: permisos por módulo","1200×900")]},
      {h3:"Perfil Desarrollador y Sandbox"},

  ],
  impact:{big:"10 → +2.000 comercios", p:"Del piloto a la operación diaria, gestionando pagos, reportes e integraciones sin llamar a soporte. El equipo comercial recuperó 4–5 horas diarias y el técnico 2–3 horas."}
},
{
  id:"cup", title:"Código Único de Pago",
  card:"Pagar en caja sin QR: 6 dígitos, aceptado en +45.000 puntos de venta",
  lead:"Pagar en caja sin QR: un código de 6 dígitos que hoy usan todos los clientes de Deuna.",
  tags:["App","Pagos","Research"], year:"2024", status:"En producción",
  meta:[["Rol","Product Designer"],["Equipo","Producto y negocio"],["Plataforma","App Deuna (personas y comercios)"],["Validación","10 pruebas de usabilidad"],["Estado","En producción"]],
  cover:img("cup/portada","Portada: pantalla de ingreso del código"),
  chapters:[

      {p:"En supermercados como Tía y Santa María pasa algo simple: en la caja no hay QR dinámico. Para millones de compras, Deuna no era una opción."},
      {p:"La solución de negocio fue un código de 6 dígitos: el cajero lo dicta, el cliente lo ingresa en la app y paga. Mi trabajo era que ese gesto fuera tan rápido como pagar en efectivo."}]},
    {h:"El reto", blocks:[
      {p:"Diseñar un pago presencial que funcione con una fila detrás, un código dictado en voz alta y un usuario que nunca había visto esta forma de pagar. Y hacerlo dentro de “Pagar en Deuna”, sin crear un flujo paralelo."},
      {pair:[img("cup/contexto-1","Momento de uso en caja","1200×900"),img("cup/contexto-2","Entrada a “Pagar en Deuna”","1200×900")]}]},
    {h:"Mi rol", blocks:[
      {p:"Diseñé el flujo de punta a punta: arquitectura, interacción, estados de error y prototipos de alta fidelidad. Planeé y ejecuté las pruebas de usabilidad, e iteré el diseño con producto y negocio."}]},
    {h:"La solución", blocks:[
      {p:"Partimos del momento real de uso: una caja de supermercado con fila, un código dictado en voz alta y ningún QR a la vista. Cada paso extra era un segundo más frente al cajero."},
      {fig:img("cup/flujo","Flujo completo: código → monto → confirmación","1600×900",{free:true})},
      {p:"Un pago en caja tampoco puede quedarse colgado. Diseñé cuatro salidas claras: código inválido, saldo insuficiente, límite transaccional superado y error del servicio. Cada una le dice al usuario qué pasó y qué hacer, con la fila esperando."},

{

/* ===== Imágenes: prueba .webp, .png, .jpg; si no existe, muestra el recuadro ===== */
const EXTS = ["webp","png","jpg","jpeg"];
function figureHTML(f, cls=""){
  return `<div class="shot ${f.free?'free':''} ${cls}" data-img="${f.img}" data-label="${f.label}" data-size="${f.size}">
    <img alt="${f.label}" loading="lazy" hidden></div>`;
}
function loadImages(root){
  root.querySelectorAll(".shot[data-img]").forEach(box=>{
    const im = box.querySelector("img"); let i = 0;
    const tryNext = () => {
      if(i >= EXTS.length){ showPh(box); return; }
      im.src = `img/${box.dataset.img}.${EXTS[i++]}`;
    };
    im.onload = () => { im.hidden = false; box.querySelector(".ph")?.remove(); };
    im.onerror = tryNext;
    tryNext();
  });
}
function showPh(box){
  if(box.querySelector(".ph")) return;
  const d = document.createElement("div"); d.className = "ph";
  d.innerHTML = `<b>${box.dataset.label}</b><code>img/${box.dataset.img}.png</code><small>${box.dataset.size} px</small>`;
  box.appendChild(d);
}

function blockHTML(b){
  if(b.p) return `<p>${b.p}</p>`;
  if(b.h3) return `<h3>${b.h3}</h3>`;
  if(b.ul) return `<ul>${b.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.ol) return `<ol>${b.ol.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  if(b.fig) return `<figure>${figureHTML(b.fig)}<figcaption>${b.fig.label}</figcaption></figure>`;
  if(b.pair) return `<div class="pair">${b.pair.map(f=>`<figure>${figureHTML(f)}<figcaption>${f.label}</figcaption></figure>`).join("")}</div>`;
  if(b.trio) return `<div class="trio">${b.trio.map(f=>`<figure>${figureHTML(f)}<figcaption>${f.label}</figcaption></figure>`).join("")}</div>`;
  if(b.finding) return `<div class="finding"><span class="k">Vimos</span><span>${b.finding[0]}</span><span class="k">Decidí</span><span>${b.finding[1]}</span></div>`;
  return "";
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-copy]"); if(!b) return;
  const t = b.dataset.copy;
  const done = () => { b.textContent = "Copiado"; setTimeout(()=>b.textContent="Copiar",1500); };
  try{ navigator.clipboard.writeText(t).then(done).catch(()=>{ selectText(b); }); }catch(_){ selectText(b); }
});
function selectText(b){ const dd=b.parentElement.querySelector("dd"); const r=document.createRange(); r.selectNodeContents(dd); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
