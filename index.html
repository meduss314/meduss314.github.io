<style>
/* Layout: loud color-blocked bands (violet hero → lime ticker → black stats → color case cards → grid-paper about → contact), stickers + 4-point sparkles as the only ornament. Single committed look (no dark/light switch). */
:root{
  --violet:#5b4cf8; --lime:#c6ff3d; --pink:#ff85f5; --black:#1b1b1f; --paper:#f4f1e9; --white:#ffffff;
  --ink:#1b1b1f; --line:rgba(27,27,31,.14);
  --cond:"Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --fun:"Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --wrap:1200px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--black); color:var(--ink); font:17px/1.6 var(--body); margin:0; overflow-x:hidden}
a{color:inherit}
img{max-width:100%; display:block}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--lime); outline-offset:3px; border-radius:6px}
.cond{font-family:var(--cond); font-weight:400; text-transform:uppercase; letter-spacing:-.005em; line-height:.9}
.mono{font:500 12px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase}
mark{background:var(--pink); color:var(--black); padding:0 .18em; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
mark.lime{background:var(--lime)}

/* header */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--black)}
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--black); color:var(--white)}
header.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px}
.logo{font:400 26px/1 var(--fun); text-decoration:none; color:var(--white); display:flex; align-items:center; gap:4px}
.logo svg{width:22px; height:22px; fill:var(--lime); transform:translateY(-6px)}
nav.links{display:flex; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font:700 14px/1 var(--body); text-decoration:none; border:2px solid currentColor; background:transparent; color:inherit; cursor:pointer; white-space:nowrap; transition:transform .15s ease}
.pill:hover{transform:translateY(-2px) rotate(-1deg)}
.pill.violet{background:var(--violet); border-color:var(--violet); color:var(--white)}
.pill.lime{background:var(--lime); border-color:var(--lime); color:var(--black)}
.pill.black{background:var(--black); border-color:var(--black); color:var(--white)}
.pill.big{padding:15px 24px; font-size:16px}
@media (max-width:640px){ nav.links .hide-sm{display:none} }

/* sparkle + sticker */
.spark{display:inline-block; width:1em; height:1em; vertical-align:-.1em}
.spark path{fill:currentColor}
.sticker{position:absolute; width:150px; height:150px; border-radius:50%; display:grid; place-items:center; z-index:2}
.sticker svg.ring{position:absolute; inset:0; width:100%; height:100%; animation:spin 18s linear infinite}
.sticker text{font:700 11.5px var(--mono); letter-spacing:.14em; text-transform:uppercase}
.sticker .core{font:400 22px/1 var(--fun); text-align:center; transform:rotate(-8deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* hero */
.hero{background:var(--violet); color:var(--white); position:relative; overflow:hidden}
.hero .wrap{position:relative; padding-block:56px 64px}
.hero-grid{display:block}
.title-row{display:flex; align-items:center; gap:clamp(28px,4vw,56px); flex-wrap:wrap}
.hero .hi{position:relative; z-index:1; min-width:0}
/* doodles en las esquinas */
.dd{position:absolute; pointer-events:none; z-index:0}
.d-tl{top:18px; left:-26px; width:150px; color:var(--paper); transform:rotate(-12deg)}
.d-tr{top:-34px; right:6%; width:120px; color:var(--lime); transform:rotate(14deg)}
.d-bl{bottom:-30px; left:3%; width:140px; color:var(--pink); transform:rotate(8deg)}
.d-br{bottom:-40px; right:-30px; width:170px; color:var(--paper)}
.d-bm{bottom:22px; left:46%; width:110px; color:var(--lime); transform:rotate(-6deg)}
@media (max-width:860px){ .d-tl{width:100px; left:-30px} .d-tr{width:80px} .d-bm{display:none} .d-bl{width:96px} .d-br{width:120px} }
/* foto */
.photo{position:relative; z-index:1; width:clamp(150px, 19vw, 270px); flex:none}
.photo img{width:100%; height:auto; aspect-ratio:1/1; object-fit:cover; border-radius:24px; border:4px solid var(--black); box-shadow:10px 10px 0 var(--lime); transform:rotate(3deg)}
.hero .kicker{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.hero h1{font-size:clamp(76px, 15.5vw, 210px); position:relative}
.hero h1 .row2{display:block; color:var(--lime)}
.hero .sub{font:600 clamp(19px,2.4vw,28px)/1.35 var(--body); max-width:30ch; margin-top:28px}
.hero .ctas{display:flex; gap:12px; flex-wrap:wrap; margin-top:30px}
.hero .sticker{width:112px; height:112px; right:-52px; bottom:-36px; background:var(--pink); color:var(--black)}
.hero .sticker .core{font-size:16px} .hero .sticker text{font-size:9.5px}
.hero .s2{position:absolute; left:-20px; top:-20px; width:46px; height:46px; color:var(--lime); z-index:2}
.hero h1{font-size:clamp(76px, 13.5vw, 196px)}
@media (max-width:640px){ .photo{width:150px} .hero .sticker{width:92px; height:92px; right:-40px; bottom:-26px} .hero .sticker .core{font-size:13px} .hero .sticker text{font-size:8px} }

/* ticker */
.ticker{background:var(--lime); color:var(--black); overflow:hidden; border-block:2px solid var(--black)}
.ticker .track{display:flex; width:max-content; gap:28px; padding-block:12px; animation:slide 30s linear infinite; font:400 22px/1 var(--cond); text-transform:uppercase; letter-spacing:.02em}
.ticker span{display:inline-flex; align-items:center; gap:28px; white-space:nowrap}
.ticker .spark{width:18px; height:18px; color:var(--violet)}
@keyframes slide{to{transform:translateX(-50%)}}

/* stats */
.stats{background:var(--black); color:var(--white)}
.stats .wrap{padding-block:64px}
.stat-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:28px}
@media (max-width:860px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{border-radius:22px; padding:22px; display:flex; flex-direction:column; justify-content:space-between; gap:28px; min-height:190px; color:var(--black)}
.stat b{font:400 clamp(44px,5.4vw,72px)/.9 var(--cond); font-variant-numeric:tabular-nums}
.stat span{font-weight:600; font-size:15px; line-height:1.35}
.c-pink{background:var(--pink)} .c-lime{background:var(--lime)} .c-violet{background:var(--violet); color:var(--white)} .c-paper{background:var(--paper)}
.sec-title{display:flex; justify-content:space-between; align-items:end; gap:18px; flex-wrap:wrap}
.sec-title h2{font-size:clamp(56px,9vw,120px)}
.sec-title p{max-width:34ch; font-weight:500}

/* cases */
.cases{background:var(--black); color:var(--white)}
.cases .wrap{padding-block:24px 80px}
.case-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:28px}
@media (max-width:760px){ .case-grid{grid-template-columns:1fr} }
.ccard{border-radius:26px; padding:22px; display:flex; flex-direction:column; gap:18px; text-decoration:none; color:var(--black); position:relative; transition:transform .2s ease}
.ccard.c-violet{color:var(--white)}
.ccard:hover{transform:translateY(-4px) rotate(-.4deg)}
.ccard .top{display:flex; justify-content:space-between; gap:10px; align-items:start}
.ccard h3{font-size:clamp(34px,3.8vw,48px)}
.badge{font:700 12px/1 var(--body); padding:7px 11px; border-radius:999px; background:var(--black); color:var(--white); white-space:nowrap}
.ccard .shot{aspect-ratio:16/10; border-radius:16px}
.ccard .bottom{display:flex; justify-content:space-between; align-items:end; gap:16px}
.ccard .bottom p{font-weight:600; max-width:36ch; line-height:1.4}
.arrow{width:44px; height:44px; flex:none; border:2px solid currentColor; border-radius:50%; display:grid; place-items:center; font-size:20px; transition:transform .2s ease}
.ccard:hover .arrow{transform:rotate(45deg)}

/* image slots */
.shot{position:relative; overflow:hidden; background:rgba(27,27,31,.08); max-width:100%; border-radius:16px}
.c-violet .shot{background:rgba(255,255,255,.12)}
.shot img{width:100%; height:100%; object-fit:cover}
.shot.free{aspect-ratio:auto}
.shot.free img{height:auto; object-fit:contain}
.shot .ph{position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:6px; padding:16px; border:2px dashed currentColor; border-radius:16px; opacity:.85}
.shot.free .ph{position:relative; min-height:240px}
.ph b{font:700 15px/1.3 var(--body)}
.ph code{font:500 12px/1.4 var(--mono); word-break:break-all}
.ph small{font:12px/1.3 var(--mono); opacity:.7}
figure{margin:0; display:flex; flex-direction:column; gap:10px}
figcaption{font-size:14px; opacity:.7}

/* about */
.about{background:var(--paper); background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:36px 36px; color:var(--black); border-radius:36px 36px 0 0}
.about .wrap{padding-block:80px}
.about-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:40px; margin-top:32px; align-items:start}
@media (max-width:860px){ .about-grid{grid-template-columns:1fr} }
.about .text{display:flex; flex-direction:column; gap:16px; font-size:19px; max-width:58ch; font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.chip{font:700 13px/1 var(--body); padding:9px 13px; border-radius:999px; border:2px solid var(--black); background:var(--white)}
.chip:nth-child(3n+1){background:var(--lime)} .chip:nth-child(3n+2){background:var(--pink)}
.tl{background:var(--black); color:var(--white); border-radius:26px; padding:10px 22px; list-style:none; margin:0}
.tl li{display:grid; grid-template-columns:96px 1fr; gap:14px; padding-block:16px; border-bottom:1px solid rgba(255,255,255,.14)}
.tl li:last-child{border-bottom:0}
.tl .when{font:500 12px/1.7 var(--mono); color:var(--lime)}
.tl b{display:block; font-weight:700}
.tl span{opacity:.7; font-size:15px}

/* contact */
.contact{background:var(--paper); color:var(--black)}
.contact .wrap{padding-block:24px 96px; text-align:center; position:relative}
.contact h2{font-size:clamp(72px,14vw,180px); position:relative; display:inline-block}
.contact h2 .spark{position:absolute; top:-8%; left:-10%; width:.42em; height:.42em; color:var(--violet)}
.contact .sticker{position:absolute; right:-6%; bottom:-10%; background:var(--lime); width:120px; height:120px; color:var(--black)}
.contact .sticker .core{font-size:18px}
.contact .lead{font-weight:600; font-size:20px; margin:28px auto 0; max-width:40ch}
.contact-list{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:36px; text-align:left}
@media (max-width:760px){ .contact-list{grid-template-columns:1fr} .contact .sticker{display:none} }
.ci{background:var(--white); border:2px solid var(--black); border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; min-width:0}
.ci dd{margin:0; font-weight:700; user-select:all; overflow-wrap:anywhere}
.ci .pill{align-self:start}
footer{background:var(--black); color:var(--white)}
footer .wrap{padding-block:26px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px; opacity:.85}

/* case page */
.chero{background:var(--violet); color:var(--white); position:relative; overflow:hidden}
.chero .wrap{padding-block:40px 56px; position:relative}
.back{display:inline-flex; margin-bottom:28px}
.chero h1{font-size:clamp(56px,10vw,132px)}
.chero .lead{font:600 clamp(19px,2.3vw,26px)/1.35 var(--body); max-width:34ch; margin-top:22px}
.chero-grid{display:grid; grid-template-columns:1.5fr .9fr; gap:36px; align-items:end}
@media (max-width:860px){ .chero-grid{grid-template-columns:1fr} }
.ticket{background:var(--lime); color:var(--black); border-radius:20px; padding:20px 22px; position:relative; transform:rotate(1.2deg); font-size:15px}
.ticket .th{display:flex; justify-content:space-between; padding-bottom:10px; border-bottom:2px dashed rgba(27,27,31,.35); margin-bottom:4px}
.ticket .row{display:flex; justify-content:space-between; gap:14px; padding-block:9px; border-bottom:1px dashed rgba(27,27,31,.25)}
.ticket .row:last-child{border-bottom:0}
.ticket .row span:first-child{font:500 12px/1.9 var(--mono); text-transform:uppercase; letter-spacing:.05em}
.ticket .row span:last-child{font-weight:700; text-align:right}
.cbody{background:var(--paper); color:var(--black)}
.cover-wrap{padding-block:40px 8px}
.chapters{display:grid; gap:64px; padding-block:48px 72px}
.chapter{display:grid; grid-template-columns:240px minmax(0,1fr); gap:32px}
@media (max-width:860px){ .chapter{grid-template-columns:1fr; gap:14px} }
.chapter > h2{font-size:clamp(40px,4.4vw,56px); position:sticky; top:84px; align-self:start}
@media (max-width:860px){ .chapter > h2{position:static} }
.content{display:flex; flex-direction:column; gap:18px; min-width:0}
.content p,.content ul,.content ol{max-width:64ch}
.content h3{font:800 22px/1.25 var(--body); margin-top:10px}
.content ul,.content ol{margin:0; padding-left:22px; display:grid; gap:10px}
.content li::marker{color:var(--violet); font-weight:800}
.pair{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
@media (max-width:640px){ .pair,.trio{grid-template-columns:1fr} }
.finding{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; padding:18px 20px; background:var(--white); border:2px solid var(--black); border-radius:20px; max-width:72ch}
.finding .k{font:700 12px/1 var(--body); padding:7px 10px; border-radius:999px; align-self:start; text-align:center}
.finding .k.v{background:var(--pink)} .finding .k.d{background:var(--lime)}
.impact{background:var(--black); color:var(--white); border-radius:28px; padding:34px; display:grid; gap:14px; position:relative; overflow:hidden}
.impact .big{font-size:clamp(46px,6.6vw,86px); color:var(--lime)}
.impact p{max-width:58ch; opacity:.85}
.impact .spark{position:absolute; right:22px; top:22px; width:54px; height:54px; color:var(--pink)}
.next{background:var(--black); color:var(--white)}
.next .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:36px}
.next a{text-decoration:none}
.next small{display:block; margin-bottom:8px; opacity:.7}
.next b{font-size:clamp(28px,4vw,44px)}

@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important; scroll-behavior:auto!important} }
</style>

<script>
/* ===== Contenido ===== */
const LINKEDIN = "https://www.linkedin.com/in/lina-valentina-prieto-acevedo";
const EMAIL = "valentinaprieto1000@gmail.com";
const PHONE = "+57 310 887 8265";

// img(id, etiqueta, tamaño recomendado, opciones)
const img = (src, label, size="1600×1000", opts={}) => ({img:src, label, size, ...opts});

const CASES = [
{
  id:"portal-deuna-negocios", title:"Portal Deuna Negocios",
  card:"De 10 comercios piloto a más de 2.000 que se autogestionan",
  lead:"De 10 comercios piloto a más de 2.000 que gestionan su negocio sin llamar a soporte.",
  tags:["B2B","Web","Fintech"], year:"2024–2026", status:"En producción",
  meta:[["Rol","Lead Product Designer"],["Equipo","Product Owner, desarrollo y arquitectura"],["Plataforma","Web B2B"],["Tiempo al MVP","2 meses"],["Estado","En producción"]],
  cover:img("deuna/portada","Portada: pantalla principal del portal"),
  chapters:[
    {h:"Contexto", blocks:[
      {p:"Deuna es la billetera digital más usada de Ecuador. Mientras más comercios la adoptaban, más crecía un costo invisible: cada pregunta de un comercio terminaba en el equipo comercial."},
      {p:"¿Llegó este pago? ¿Me reenvías el reporte de ayer? ¿Cómo me integro? El equipo comercial dedicaba 4–5 horas diarias a responder. Los desarrolladores senior y el arquitecto, 2–3 horas diarias a soporte de integraciones."}]},
    {h:"El reto", blocks:[
      {p:"No bastaba con diseñar un portal. Había que convencer a la dirección de que no era un gasto más, sino la forma de dejar de pagar ese tiempo todos los días. Y hacerlo con un MVP que saliera en dos meses."},
      {fig:img("deuna/reto","El problema: comercios pidiendo soporte por pagos y reportes","1600×900",{free:true})}]},
    {h:"Mi rol", blocks:[
      {p:"Lideré el diseño de punta a punta, de discovery a QA visual. Construí con el equipo el caso de negocio, definí la arquitectura de información, diseñé y validé los flujos, y acompañé la evolución del producto después del lanzamiento."}]},
    {h:"Lo que descubrimos", blocks:[
      {p:"Antes de dibujar una pantalla, medimos de dónde venía la carga operativa. Tres hallazgos definieron el producto:"},
      {ul:["Los comercios validaban pagos con capturas de pantalla. Al cerrar caja, el cliente mostraba una foto del pago y el comercio llamaba para confirmar.","Los reportes vivían en el correo. Si no llegaban, el comercio no podía cerrar caja y pedía un reenvío.","Las integraciones consumían al equipo técnico. Cada empresa que quería conectarse necesitaba acompañamiento de un desarrollador senior."]},
      {fig:img("deuna/hallazgos","Mapa de hallazgos o arquitectura de información","1600×1000",{free:true})}]},
    {h:"Lo que decidimos", blocks:[
      {p:"Con esos datos armamos el caso de negocio que aprobó el proyecto. De ahí salieron tres decisiones:"},
      {ol:["Empezar solo por transacciones y reportes. Eran las dos solicitudes más frecuentes. Dejamos integraciones y permisos para una segunda fase y así salimos en dos meses.","Diseñar para quien cierra caja, no para un analista. Tiempo real, búsqueda por pagador o número de transacción y el detalle a un clic: confirmar un pago debe tomar segundos.","Tratar la integración como un producto. El perfil de desarrollador y el sandbox atacaron directamente las horas del equipo técnico."]}]},
    {h:"Primer MVP", blocks:[
      {h3:"Transacciones en tiempo real"},
      {p:"El comercio confirma un pago al instante desde el portal, sin pedir capturas ni llamar al equipo comercial. Ventas y devoluciones van separadas, y cada transacción tiene su detalle completo."},
      {fig:img("deuna/transacciones","Pantalla de transacciones","1600×1000",{free:true})},
      {h3:"Historial de reportes"},
      {p:"Los reportes que antes llegaban por correo ahora están siempre disponibles, filtrados por fecha, frecuencia y sucursal. El comercio los descarga cuando los necesita y puede cerrar caja sin esperar a nadie."},
      {fig:img("deuna/reportes","Pantalla de reportes","1600×1000",{free:true})}]},
    {h:"Segunda fase", blocks:[
      {p:"Con el portal en uso, las necesidades de los comercios más grandes marcaron la segunda fase: controlar quién ve qué, e integrarse sin depender del equipo técnico de Deuna."},
      {h3:"Roles y Permisos"},
      {p:"Diseñamos un sistema de accesos para que diferentes perfiles dentro de una empresa pudieran operar el portal con distintos niveles de visibilidad y control, protegiendo información sensible sin afectar la operación diaria."},
      {trio:[img("deuna/roles-1","Roles: listado de usuarios","1200×900"),img("deuna/roles-2","Roles: crear o editar rol","1200×900"),img("deuna/roles-3","Roles: permisos por módulo","1200×900")]},
      {h3:"Perfil Desarrollador y Sandbox"},
      {p:"Creamos un espacio para empresas que querían integrarse técnicamente con Deuna: documentación, configuración de webhooks, credenciales y un ambiente sandbox para pruebas de integración."},

/* ===== Imágenes: prueba .webp, .png, .jpg; si no existe, muestra el recuadro ===== */
const EXTS = ["webp","png","jpg","jpeg"];
function figureHTML(f){
  return `<div class="shot ${f.free?'free':''}" data-img="${f.img}" data-label="${f.label}" data-size="${f.size}"><img alt="${f.label}" loading="lazy" hidden></div>`;
}
function loadImages(root){
  root.querySelectorAll(".shot[data-img]").forEach(box=>{
    const im = box.querySelector("img"); let i = 0;
    const tryNext = () => { if(i >= EXTS.length){ showPh(box); return; } im.src = `img/${box.dataset.img}.${EXTS[i++]}`; };
    im.onload = () => { im.hidden = false; box.querySelector(".ph")?.remove(); };
    im.onerror = tryNext; tryNext();
  });
}
function showPh(box){
  if(box.querySelector(".ph")) return;
  const d = document.createElement("div"); d.className = "ph";
  d.innerHTML = `<b>${box.dataset.label}</b><code>img/${box.dataset.img}.png</code><small>${box.dataset.size} px</small>`;
  box.appendChild(d);
}

/* Doodles: estrella puntiaguda + garabatos, en las esquinas */
function burst(points=8){
  const pts=[]; for(let i=0;i<points*2;i++){ const a=Math.PI*i/points - Math.PI/2; const r = i%2 ? 13 : (i%4===0 ? 50 : 38); pts.push((50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1)); }
  return `<polygon points="${pts.join(" ")}" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>`;
}

  loops:'M6 46 C6 10 40 6 42 30 C44 50 22 52 22 34 C22 10 62 6 64 30 C66 50 44 52 44 34 C44 10 84 6 86 30 C88 48 100 50 114 40',
  wave:'M6 62 C16 10 32 8 36 52 C40 10 56 8 60 52 C64 10 80 8 86 58',

  esse:'M8 40 C24 4 52 6 52 34 C52 58 30 60 32 42 C34 22 70 20 80 48 C88 70 104 70 116 58'
};
function doodle(kind, cls){
  if(kind==="burst") return `<svg class="dd ${cls}" viewBox="0 0 100 100" aria-hidden="true">${burst()}</svg>`;
  return `<svg class="dd ${cls}" viewBox="0 0 120 100" aria-hidden="true"><path d="${SQUIG[kind]}" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function blockHTML(b){
  if(b.p) return `<p>${b.p}</p>`;
  if(b.h3) return `<h3>${b.h3}</h3>`;
  if(b.ul) return `<ul>${b.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.ol) return `<ol>${b.ol.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  if(b.fig) return `<figure>${figureHTML(b.fig)}<figcaption>${b.fig.label}</figcaption></figure>`;
  if(b.pair) return `<div class="pair">${b.pair.map(f=>`<figure>${figureHTML(f)}<figcaption>${f.label}</figcaption></figure>`).join("")}</div>`;
  if(b.trio) return `<div class="trio">${b.trio.map(f=>`<figure>${figureHTML(f)}<figcaption>${f.label}</figcaption></figure>`).join("")}</div>`;
  if(b.finding) return `<div class="finding"><span class="k v">Vimos</span><span>${b.finding[0]}</span><span class="k d">Decidí</span><span>${b.finding[1]}</span></div>`;
  return "";
}

function caseView(c){
  const i = CASES.indexOf(c), nx = CASES[(i+1)%CASES.length];
  return `
  <section class="chero">
    ${SCRIBBLE}
    <div class="wrap">
      <a class="pill back" href="#casos">← Todos los casos</a>
      <div class="chero-grid">
        <div>
          <span class="mono">${c.tags.join(" · ")} · ${c.year}</span>
          <h1 class="cond" style="margin-top:14px">${c.title}</h1>
          <p class="lead">${c.lead}</p>
          ${c.link?`<div style="margin-top:22px"><a class="pill lime" href="${c.link.href}" target="_blank" rel="noopener">${c.link.label} ↗</a></div>`:""}
        </div>
        <div class="ticket">
          <div class="th mono"><span>Ficha del proyecto</span><span>${c.year}</span></div>
          ${c.meta.map(([k,v])=>`<div class="row"><span>${k}</span><span>${v}</span></div>`).join("")}
        </div>
      </div>
    </div>
  </section>
  <div class="cbody">
    <div class="wrap cover-wrap"><figure>${figureHTML({...c.cover, free:true})}</figure></div>
    <div class="wrap chapters">
      ${c.chapters.map(ch=>`<section class="chapter"><h2 class="cond">${ch.h}</h2><div class="content">${ch.blocks.map(blockHTML).join("")}</div></section>`).join("")}
      <section class="chapter"><h2 class="cond">Impacto</h2><div class="content"><div class="impact">${SPARK}<span class="big cond">${c.impact.big}</span><p>${c.impact.p}</p></div></div></section>
    </div>
  </div>
  <nav class="next" aria-label="Más casos"><div class="wrap">
    <a href="#casos"><small class="mono">Volver</small><b class="cond">Todos los casos</b></a>
    <a href="#${nx.id}" style="text-align:right"><small class="mono">Siguiente caso</small><b class="cond" style="color:var(--lime)">${nx.title} →</b></a>
  </div></nav>`;
}

function render(){
  const id = location.hash.slice(1);
  const c = CASES.find(x=>x.id===id);
  if(c){ app.innerHTML = caseView(c); app.dataset.home=""; document.title = `${c.title} · Lina Prieto`; window.scrollTo(0,0); }
  else {
    if(!app.dataset.home){ app.innerHTML = homeView(); app.dataset.home="1"; document.title = "Lina Prieto · Product Designer"; }
    if(id){ document.getElementById(id)?.scrollIntoView(); } else window.scrollTo(0,0);
  }
  loadImages(app);
}
window.addEventListener("hashchange", render);
render();

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-copy]"); if(!b) return;
  const done = () => { b.textContent = "Copiado"; setTimeout(()=>b.textContent="Copiar",1500); };
  try{ navigator.clipboard.writeText(b.dataset.copy).then(done).catch(()=>selectText(b)); }catch(_){ selectText(b); }
});
function selectText(b){ const dd=b.parentElement.querySelector("dd"); const r=document.createRange(); r.selectNodeContents(dd); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
</script>

</body>
