"cup":{
  title:"Unique Payment Code",
  card:"Pay at the register without a QR: 6 digits, accepted at 45,000+ points of sale",
  lead:"Pay at the register without a QR: a 6-digit code the cashier reads out and the customer enters in the Deuna app or in Banco Pichincha’s mobile banking.",
  tags:["App","Payments","Research"], status:"Live",
  meta:[["Role","Product Designer"],["Research","Paired with Elizabeth Mendoza"],["Platform","Deuna app and Pichincha mobile banking"],["Validation","2 moderated tests · 16 people"],["Status","Live"]],
  summary:[["The problem","Fake QR codes made many merchants stop displaying Deuna’s QR, and large merchants had no screen at the register to show it."],["What I did","Benchmark, prioritization, storyboard, the end-to-end flow with its error states, and two moderated tests in bank branches, on the Deuna app and in mobile banking."],["Result","Live for all users, accepted at more than 45,000 points of sale and available from Banco Pichincha’s mobile banking."]],
  coverLabel:"Unique Payment Code: choose the option, enter the 6 digits and get the receipt",
  chapters:[
    {h:"Context", blocks:[
      {p:"Fake QR codes started circulating in Ecuador. Many merchants stopped displaying Deuna’s QR for fear of fraud, and large merchants with several registers had no screen to show it on either. It’s the same problem: if there’s no QR in sight, the customer doesn’t pay with Deuna."},
      {p:"The business goal was to grow active users and MDR with a payment method for large merchants with no QR interface, available in Deuna, in mobile banking and in credit unions."}]},
    {h:"My role", blocks:[
      {p:"We worked on it end to end with my research partner, Elizabeth Mendoza: benchmark, prioritization, storyboard, design, user testing and iteration. I designed the full flow, from the entry point to the error states and the high-fidelity prototypes, and co-facilitated the tests."}]},
    {h:"Benchmark and prioritization", blocks:[
      {p:"We reviewed how wallets take payments in Latin America and the United States. We found four patterns and compared them on three criteria: it scales, it works across devices, and it’s easy for the user."},
      {fig:img("cup/benchmark","Benchmark: four wallet payment patterns","1600×1000",{free:true})},
      {p:"The code won: it works without a card, doesn’t depend on a printed QR, and the same gesture works at the register, in an online store or from another banking app."}]},
    {h:"The moment of use", blocks:[
      {p:"Before designing screens, we drew the scene: a register with a line, a cashier reading the code out loud and a customer who had never paid this way. Every extra step was one more second in front of the cashier."},
      {fig:img("cup/storyboard","Storyboard: paying at the register with the code","1600×1280",{free:true})}]},
    {h:"The solution", blocks:[
      {p:"The code lives inside “Pay”, next to Deuna’s QR, with a “New” tag: we didn’t add a separate entry on the home screen. The user enters the 6 digits, checks the merchant and amount, pays and gets the receipt."},
      {video:{src:"cup/pago-video",label:"Walkthrough: from Pay to the receipt"}},
      {fig:img("cup/flujo","Final flow in the Deuna app","1600×1000",{free:true})},
      {p:"A payment at the register can’t be left hanging either. I designed clear ways out for an invalid code, insufficient balance, transaction limit and service error, each one saying what happened and what to do, and always with the option to pay another way."},
      {fig:img("cup/estados","Code entry, error and confirmation","1600×1000",{free:true})}]},
    {h:"Test 1: Deuna app", blocks:[
      {p:"A moderated test in a Banco Pichincha branch with 6 people, prototype in hand. We wanted to know whether they understood how the code works and where they got stuck."},
      {stats:[["5/6","looked for the code in “Pay”"],["6","people in the test"],["2","micro-interactions compared"],["0","comments on amount and confirmation"]]},
      {finding:["They confused the code with an OTP or verification code.","We changed the copy to “It’s a number the business gives you and it changes every time you pay” and grouped the digits in pairs so it reads as a payment code."]},
      {finding:["They didn’t notice any difference between the two input micro-interactions.","We kept the simplest one: boxes that advance on their own and validate when the sixth digit is entered."]},
      {finding:["They showed the receipt to the cashier so they could take a photo of it, as in small shops.","The receipt highlights amount, merchant and transaction number, and the merchant gets the confirmation at the register."]},
      {finding:["Amount and confirmation drew no comments at all.","We left them alone. Knowing what not to change is a decision too."]}]},
    {h:"Test 2: mobile banking", blocks:[
      {p:"The code also had to work from Banco Pichincha’s mobile banking. We ran a second moderated test with 10 people to choose the name and position of the Deuna entry point inside the bank’s app, measuring time on task and success rate."},
      {finding:["The 3 who asked for help and the 4 who didn’t finish the task couldn’t find the Deuna entry point on the home screen. “Scan or show QR” didn’t say the code exists too.","We proposed a name covering every way to pay with Deuna and moved it to the top tabs, the fastest option on time on task."]},
      {fig:img("cup/hallazgos","Synthesis of both tests","1600×1000",{free:true})}]},
    {h:"What I learned", blocks:[
      {learn:"A new payment method competes with habit: users look for it where they already pay and read it through what they already know, like an OTP. Designing was mostly about removing those confusions."}]}
  ],
  impact:{big:"45,000+ points of sale", p:"Live for all Deuna users, accepted at more than 45,000 points of sale after the Datafast partnership, and also available from Banco Pichincha’s mobile banking."}
},
"suscripciones":{
  title:"Subscriptions and direct debits",
  card:"Card-free direct debits, straight from the wallet",
  lead:"Paying for subscriptions and orders with the wallet, no card needed: complex tokenization turned into “link your account”.",
  tags:["App","Payments","Research"], status:"In development",
  meta:[["Role","Senior Product Designer"],["Research","My own desk research and benchmark"],["Platform","Deuna app + merchant apps"],["Status","In development"]],
  summary:[["The problem","International digital merchants that charge through dLocal only accepted cards, and Deuna has no card."],["What I did","Desk research and a benchmark of recurring payments in Latin America, cross-app flows, test prototypes, error states and step-by-step measurement."],["Result","A card-free recurring payment method: the user links their account once and pays without leaving the merchant’s app."]],
  coverLabel:"Linking: choose Deuna in the merchant app, accept and return",
  chapters:[
    {h:"Context", blocks:[
      {p:"Ordering food, paying for streaming or a membership: almost every recurring charge in apps requires a card. Deuna has no card, and we didn’t want to invent one."},
      {p:"The opportunity came from dLocal, the processor that collects payments in Latin America for international digital merchants in delivery, mobility, streaming and e-commerce. For those merchants to charge with Deuna, the wallet needed the ability to take automatic payments."},
      {p:"The technical answer was to tokenize the user’s account: a token that behaves like a card for the merchant and is only handed over when the user accepts the link. The design question: how do you explain that to someone who just wants to pay for their order?"}]},
    {h:"My role", blocks:[
      {p:"I led the design end to end in the Deuna app. I did the desk research and benchmark myself, designed the linking, payment and unlinking flows with their errors, built the test prototypes and the presentation for the bank, and defined what to measure at each step. I worked with architecture and engineering to understand what tokenization allowed and where its limits were."}]},
    {h:"Research", blocks:[
      {p:"The goals were clear: grow MDR with recurring revenue, enable recurring payments from the Deuna account, and build something that would work for many merchants, not a one-off for a single one."},
      {p:"I studied how subscriptions work in Latin America: card subscriptions, bank direct debits for utilities and new account-to-account models such as Pix Automático in Brazil or account-to-account payments in Colombia all coexist. I also walked through the real flows of wallets, banks and apps across the region."},
      {fig:img("suscripciones/benchmark","Benchmark and desk research: 4 learnings","1600×1000",{free:true})},
      {p:"The most important conclusion: people don’t complain because they get charged, they complain because they don’t know who is charging them or can’t find how to stop it."}]},
    {h:"The solution", blocks:[
      {p:"The flow starts in the merchant’s app, jumps to Deuna to authorize and returns to the merchant. The user links once and then pays without leaving the app."},
      {video:{src:"suscripciones/vinculacion-video",label:"Walkthrough: from the merchant to Deuna and back"}},
      {fig:img("suscripciones/flujo","Linking in five steps","1600×1000",{free:true})}]},
    {h:"Design decisions", blocks:[
      {finding:["Tokenization is a technical concept that scares people, and the main fear was that linking would trigger a charge.","We talk about “link your account”, an action people already know, and the screen says from the start “This step doesn’t charge you anything”."]},
      {finding:["In the benchmark, the authorization moment is where trust is won or broken.","A screen dedicated to just that: who is charging, three clear benefits (secure payments, available balance, full control) and explicit acceptance of the terms before the button is enabled."]},
      {finding:["The jump between the merchant’s app and Deuna creates distrust.","You always see which merchant is asking for permission, the Deuna sign-in says why you’re there, and the confirmation sends you straight back to the merchant."]},
      {finding:["In the benchmark, subscription and recurring payment were used as if they were the same thing.","Each type has its own description, hierarchy and status: fixed and periodic, or variable by usage."]},
      {fig:img("suscripciones/estados","Before accepting, error and confirmation","1600×1000",{free:true})},
      {p:"And the cases nobody sees: invalid session, account already linked, temporary and permanent errors, and waiting for a response. Each one tells the user what happened and lets them get back to the merchant without getting stuck."}]},
    {h:"Visible control", blocks:[

function loadImages(root){
  root.querySelectorAll(".shot[data-img]").forEach(box=>{
    const im = box.querySelector("img");
    const list = [`img/${box.dataset.img}.png`, `img/${box.dataset.img}.jpg`];
    if(box.dataset.remote) list.push(box.dataset.remote + "?scale-down-to=2048");
    let i = 0;
    const tryNext = () => { if(i >= list.length){ showPh(box); return; } im.src = list[i++]; };
    im.onload = () => { box.classList.add("loaded"); box.querySelector(".ph")?.remove(); };
    im.onerror = tryNext; tryNext();
  });
}
function showPh(box){

}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io;
function setupReveal(){
  io?.disconnect();
  if(reduce || !("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -8% 0px", threshold:.08});
  app.querySelectorAll(".rv").forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < innerHeight*0.92) { el.classList.add("in"); return; }   // lo visible al cargar no se oculta
    el.classList.add("wait"); io.observe(el);
  });
}

    const row = split.clientWidth;
    const h = txt.offsetHeight;
    media.style.height = h + "px";
    if(media.classList.contains("photo")) media.style.width = Math.min(h, row*0.36, 440) + "px";
  };
  ro = new ResizeObserver(apply); ro.observe(txt); addEventListener("resize", apply); apply();
}
function setupCount(){
  const els=[...document.querySelectorAll(".kpis b[data-n]")];
  if(reduce || !("IntersectionObserver" in window)) return;
  const ob=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; ob.unobserve(e.target);
    const el=e.target, raw=el.dataset.n, m=raw.match(/^([^0-9]*)([0-9]+)(.*)$/); if(!m) return;
    const end=+m[2], t0=performance.now(), d=900;
    const tick=now=>{ const p=Math.min(1,(now-t0)/d), val=Math.round(end*(1-Math.pow(1-p,3))); el.textContent=m[1]+val+m[3]; if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); }),{threshold:.6});
  els.forEach(el=>ob.observe(el));
}
function setupSlider(){
  const s = document.getElementById("statSlider"), dots = document.getElementById("statDots");
  if(!s || !dots) return;
  s.addEventListener("scroll", ()=>{
    const cards=[...s.children]; const mid = s.scrollLeft + s.clientWidth/2;
    let k = 0, best = 1e9; cards.forEach((c,i)=>{ const d=Math.abs(c.offsetLeft + c.offsetWidth/2 - mid); if(d<best){best=d;k=i;} });
    [...dots.children].forEach((d,i)=>d.classList.toggle("on", i===k));
  }, {passive:true});
}

function render(){
  const id = location.hash.slice(1);
  const c = CASES.find(x=>x.id===id);
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T(el.dataset.t); });
  const lb = document.getElementById("langBtn"); if(lb) lb.setAttribute("aria-label", T("otherLabel"));
  if(c){ app.innerHTML = caseView(c); app.dataset.home=""; document.title = `${tr(c).title} · Lina Prieto`; window.scrollTo(0,0); }
  else if(id==="proyectos"){ app.innerHTML = moreView(); app.dataset.home=""; document.title = `${T("masTitle")} · Lina Prieto`; window.scrollTo(0,0); }
  else {
    if(!app.dataset.home){ app.innerHTML = homeView(); app.dataset.home="1"; document.title = T("homeTitle"); }
    if(id){ document.getElementById(id)?.scrollIntoView(); } else window.scrollTo(0,0);
  }
  loadImages(app); syncMedia(); setupReveal(); setupSlider(); setupCount();
}
let first = true;
function go(){
  const changesView = !!CASES.find(x=>x.id===location.hash.slice(1)) || location.hash==="#proyectos" || !app.dataset.home;
  if(!first && changesView && document.startViewTransition && !reduce){ document.startViewTransition(render); }
  else render();
  first = false;
}
window.addEventListener("hashchange", go);
if(!reduce){ let tick=false; addEventListener("scroll",()=>{ if(tick) return; tick=true; requestAnimationFrame(()=>{ document.querySelectorAll(".dd").forEach((d,i)=>{ const r=d.getBoundingClientRect(); const k=((i%3)+1)*0.06; d.style.setProperty("--py", ((r.top - innerHeight/2)*-k).toFixed(1)+"px"); }); tick=false; }); },{passive:true}); }
go();
document.getElementById("langBtn")?.addEventListener("click", ()=>setLang(LANG==="en"?"es":"en"));

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-copy]"); if(!b) return;
  const done = () => { b.textContent = T("copiado"); setTimeout(()=>b.textContent=T("copiar"),1500); };
  try{ navigator.clipboard.writeText(b.dataset.copy).then(done).catch(()=>selectText(b)); }catch(_){ selectText(b); }
});
function selectText(b){ const dd=b.parentElement.querySelector("dd"); const r=document.createRange(); r.selectNodeContents(dd); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
</script>
